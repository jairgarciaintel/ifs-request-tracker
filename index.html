<html lang="en">
<head>

<title>FS Request Tracker — DA Ops</title>

<link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,400&f[]=satoshi@400,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow-x:hidden;}
:root{
  --navy:#041c32;--navy-mid:#0d3158;--blue:#0071c5;--cyan:#4ec8f0;
  --green:#6bcb77;--amber:#f0a030;--red:#cc0000;--white:#ffffff;
  --light:rgba(255,255,255,0.7);--subtle:rgba(255,255,255,0.15);
}
body{
  font-family:'Satoshi',sans-serif;
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy-mid) 50%,#0a2540 100%);
  color:var(--white);min-height:100vh;
  zoom:1.4;
}
/* Fallback para navegadores que no soportan zoom (Firefox) */
@supports not (zoom:1){
  body{transform:scale(1.4);transform-origin:top left;width:71.4%;}
}
.circle{position:fixed;border-radius:50%;border:1.5px solid;pointer-events:none;}
@keyframes driftAll{0%{transform:translateX(0) translateY(0);}25%{transform:translateX(40px) translateY(-20px);}50%{transform:translateX(-30px) translateY(30px);}75%{transform:translateX(20px) translateY(-40px);}100%{transform:translateX(0) translateY(0);}}
</style>
</head>
<body>
<div id="circles-container"></div>
<script>
// Generate 40 animated circles
(function(){
  const container = document.getElementById('circles-container');
  const count = 40;
  for(let i=0;i<count;i++){
    const circle = document.createElement('div');
    const size = 30 + Math.random()*200;
    const top = Math.random()*100;
    const left = Math.random()*100;
    const delay = Math.random()*-20;
    const colors = ['rgba(78,200,240,','rgba(0,113,197,','rgba(107,203,119,','rgba(240,160,48,'];
    const color = colors[Math.floor(Math.random()*colors.length)] + (0.04+Math.random()*0.06)+')';
    circle.style.cssText = `position:fixed;border-radius:50%;pointer-events:none;border:1.5px solid ${color};width:${size}px;height:${size}px;top:${top}%;left:${left}%;animation:driftAll 20s ease-in-out infinite;animation-delay:${delay}s;`;
    container.appendChild(circle);
  }
})();
</script>

<!-- SVG Icons (inline defs) -->
<svg style="display:none;">
  <defs>
    <symbol id="icon-check" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="#6bcb77" stroke-width="1.5"/><polyline points="4.5,8.5 7,11 11.5,5.5" fill="none" stroke="#6bcb77" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-progress" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="#f0a030" stroke-width="1.5"/><path d="M8,4 v4 l3,2" fill="none" stroke="#f0a030" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>

    <symbol id="icon-new" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="rgba(255,255,255,0.2)"/></symbol>
    <symbol id="icon-sync" viewBox="0 0 16 16"><path d="M2,8 A6,6 0 0,1 14,8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M14,8 A6,6 0 0,1 2,8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polyline points="12,5 14,8 11,8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-export" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.3"/><polyline points="5,9 8,12 11,9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="8" y1="4" x2="8" y2="11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<header class="header">
  <div class="header-left">
    <img src="Logo.png" alt="Intel Foundry" class="logo"/>
    <div class="header-title">
      <h1>FS <span class="accent">Request Tracker</span></h1>
      <p class="meta">DA Ops · Private View · Jenn &amp; Jair</p>
    </div>
  </div>
  <div class="header-right">
    <span id="sync-status" class="sync-text">Loading...</span>
    <button class="btn btn-primary" onclick="fetchAndRender()"><svg width="14" height="14"><use href="#icon-sync"/></svg> Sync</button>
    <button class="btn btn-secondary" onclick="exportExcel()"><svg width="14" height="14"><use href="#icon-export"/></svg> Excel</button>
    <button class="btn btn-secondary" onclick="exportJSON()"><svg width="14" height="14"><use href="#icon-export"/></svg> JSON</button>
  </div>
</header>

<div class="toolbar">
  <div class="filters">
    <select id="filter-time" onchange="renderRequests()">
      <option value="all">All 2026</option>
      <option value="this-month">This Month</option>
      <option value="last-month">Last Month</option>
      <option value="2-months">2 Months Ago</option>
      <option value="3-months">3 Months Ago</option>
    </select>
    <select id="filter-type" onchange="renderRequests()">
      <option value="all">All Types</option>
      <option value="Portal Creation">Portal Creation</option>
      <option value="New DA">New DA</option>
      <option value="Codename">Codename</option>
      <option value="WebView AGS Role">WebView AGS Role</option>
      <option value="Portal Unencryption">Portal Unencryption</option>
      <option value="IFS NDA">IFS NDA</option>
      <option value="DA Edit">DA Edit</option>
      <option value="COD">COD</option>
    </select>
    <select id="filter-status" onchange="renderRequests()">
      <option value="all">All Statuses</option>
      <option value="not-started">Not Started</option>
      <option value="in-progress">In Progress</option>
      <option value="complete">Complete</option>
      <option value="failed">Failed</option>
    </select>
    <input type="text" id="search-box" placeholder="Search customer or ID..." oninput="renderRequests()"/>
  </div>
  <div class="toolbar-actions">
    <button class="btn btn-secondary btn-sm" onclick="toggleAllCards(true)">Expand All</button>
    <button class="btn btn-secondary btn-sm" onclick="toggleAllCards(false)">Collapse All</button>
    <button class="btn btn-secondary btn-sm" onclick="toggleTheme()">Light/Dark</button>
  </div>
</div>
<div class="stats-row">
  <div class="stats-bar">
    <span id="stat-total" class="stat-pill stat-clickable stat-active" onclick="toggleStatFilter('all')">0 total</span>
    <span id="stat-progress" class="stat-pill s-progress stat-clickable" onclick="toggleStatFilter('in-progress')">0 WIP</span>
    <span id="stat-complete" class="stat-pill s-done stat-clickable" onclick="toggleStatFilter('complete')">0 done</span>
    <span id="stat-new" class="stat-pill s-new stat-clickable" onclick="toggleStatFilter('not-started')">0 new</span>
  </div>
  <select id="sort-order" onchange="renderRequests()" style="background:rgba(4,28,50,0.8);color:var(--light);border:1px solid rgba(78,200,240,0.2);padding:5px 10px;border-radius:6px;font-size:11px;">
    <option value="id-desc">Newest First (ID)</option>
    <option value="id-asc">Oldest First (ID)</option>
    <option value="age-desc">Oldest Unresolved</option>
  </select>
</div>

<main id="request-list" class="request-list">
  <div class="empty-state"><h3>Loading...</h3></div>
</main>

<style>
.header{padding:16px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(4,28,50,0.92);border-bottom:1px solid rgba(78,200,240,0.15);backdrop-filter:blur(10px);position:sticky;top:0;z-index:100;}
.header-left{display:flex;align-items:center;gap:16px;}
.logo{height:28px;width:auto;}
.header-title h1{font-family:'Cabinet Grotesk',sans-serif;font-size:1.3rem;font-weight:700;}
.header-title h1 .accent{color:var(--cyan);}
.header-title .meta{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:12px;}
.sync-text{font-size:12px;color:rgba(255,255,255,0.5);}
.btn{border:none;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:'Satoshi',sans-serif;display:inline-flex;align-items:center;gap:5px;}
.btn-primary{background:var(--cyan);color:var(--navy);}
.btn-primary:hover{background:#7dd8f5;transform:translateY(-1px);}
.btn-secondary{background:rgba(255,255,255,0.05);color:var(--light);border:1px solid var(--subtle);}
.btn-secondary:hover{background:rgba(78,200,240,0.08);border-color:var(--cyan);color:var(--cyan);}
.toolbar{padding:10px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(13,49,88,0.3);border-bottom:1px solid rgba(78,200,240,0.08);}
.toolbar-actions{display:flex;gap:6px;}
.btn-sm{padding:5px 10px;font-size:11px;}
.stats-row{padding:8px 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(13,49,88,0.15);}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.filters select,.filters input{background:rgba(4,28,50,0.8);color:var(--light);border:1px solid rgba(78,200,240,0.2);padding:6px 10px;border-radius:6px;font-size:11px;font-family:'Satoshi',sans-serif;}
.filters input{width:160px;}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--cyan);}
.stats-bar{display:flex;gap:8px;}
.stat-pill{font-size:11px;padding:4px 10px;border-radius:12px;font-weight:600;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);}
.stat-clickable{cursor:pointer;transition:all 0.2s;border:1px solid transparent;}
.stat-clickable:hover{transform:translateY(-1px);opacity:0.9;}
.stat-clickable.stat-active{border-color:rgba(255,255,255,0.3);box-shadow:0 0 6px rgba(255,255,255,0.1);}
.s-progress{background:rgba(240,160,48,0.12);color:var(--amber);}
.s-progress.stat-active{border-color:var(--amber);box-shadow:0 0 6px rgba(240,160,48,0.3);}
.s-done{background:rgba(107,203,119,0.12);color:var(--green);}
.s-done.stat-active{border-color:var(--green);box-shadow:0 0 6px rgba(107,203,119,0.3);}
.s-new{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.4);}
.s-new.stat-active{border-color:rgba(255,255,255,0.4);box-shadow:0 0 6px rgba(255,255,255,0.1);}
.request-list{padding:20px 32px;display:flex;flex-direction:column;gap:14px;}
.empty-state{text-align:center;padding:80px 20px;color:rgba(255,255,255,0.4);}
.empty-state h3{font-family:'Cabinet Grotesk',sans-serif;font-size:1.3rem;color:var(--cyan);}
</style>

<style>
/* === GROUPED REQUEST CARD === */
.group-card{
  background:rgba(255,255,255,0.02);border:1px solid rgba(78,200,240,0.1);
  border-radius:12px;overflow:hidden;transition:border-color 0.3s,box-shadow 0.3s;
}
.group-card:hover{border-color:rgba(78,200,240,0.25);box-shadow:0 4px 20px rgba(78,200,240,0.04);}
/* === CANCELED REQUEST === */
.group-card.canceled{position:relative;border-color:rgba(150,150,150,0.25);filter:grayscale(0.85);opacity:0.72;}
.group-card.canceled::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:5;border-radius:12px;
  background:repeating-linear-gradient(135deg,
    rgba(160,160,160,0.10) 0px,
    rgba(160,160,160,0.10) 12px,
    rgba(120,120,120,0.16) 12px,
    rgba(120,120,120,0.16) 24px);
}
.group-card.canceled:hover{border-color:rgba(150,150,150,0.4);box-shadow:none;}
.canceled-tag{
  position:absolute;top:6px;left:10px;z-index:6;
  font-family:'Cabinet Grotesk',sans-serif;font-size:8px;font-weight:700;letter-spacing:0.8px;
  color:#9aa0a6;background:rgba(90,90,90,0.22);border:1px solid rgba(150,150,150,0.35);
  padding:1px 6px;border-radius:6px;text-transform:uppercase;
}
.group-header{
  display:flex;align-items:center;gap:14px;padding:16px 20px;
  cursor:pointer;transition:background 0.2s;
}
.group-header:hover{background:rgba(78,200,240,0.03);}
.group-id{font-family:'Cabinet Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--cyan);}
.group-customer{flex:1;font-size:19px;color:var(--light);}
.group-badges{display:flex;gap:6px;flex-wrap:wrap;}
/* === VIEWING HIGHLIGHT === */
.group-card.being-viewed{border-color:var(--amber);box-shadow:0 0 12px rgba(240,160,48,0.15);position:relative;}
.viewing-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:var(--amber);font-weight:700;padding:6px 16px;background:rgba(240,160,48,0.15);border-radius:10px;border:1px solid rgba(240,160,48,0.4);animation:pulse 2s infinite;z-index:10;backdrop-filter:blur(4px);}
.badge{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;}
.badge-portal{background:rgba(139,92,246,0.12);color:#a78bfa;border:1px solid rgba(139,92,246,0.25);}
.badge-nda{background:rgba(78,200,240,0.1);color:var(--cyan);border:1px solid rgba(78,200,240,0.25);}
.badge-codename{background:rgba(107,203,119,0.1);color:var(--green);border:1px solid rgba(107,203,119,0.25);}
.badge-webview{background:rgba(240,160,48,0.1);color:var(--amber);border:1px solid rgba(240,160,48,0.25);}
.group-overall{min-width:20px;display:flex;align-items:center;}
.group-date{font-size:11px;color:rgba(255,255,255,0.25);min-width:50px;text-align:right;}
.chevron{font-size:16px;color:rgba(255,255,255,0.25);transition:transform 0.3s;margin-left:6px;}
.group-card.open .chevron{transform:rotate(90deg);color:var(--cyan);}

/* === SECTIONS INSIDE CARD === */
.group-body{max-height:0;overflow:hidden;transition:max-height 0.5s ease;}
.group-card.open .group-body{max-height:2000px;}
.type-section{padding:10px 20px 14px;border-top:1px solid rgba(78,200,240,0.06);}
.type-section-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.type-section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;}
.title-portal{color:#a78bfa;}
.title-nda{color:var(--cyan);}
.title-codename{color:var(--green);}
.title-webview{color:var(--amber);}
.section-status{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11px;color:rgba(255,255,255,0.5);}
.substep-row{display:flex;align-items:center;padding:6px 0;border-top:1px solid rgba(255,255,255,0.03);}
.substep-label{flex:1;font-size:12px;color:rgba(255,255,255,0.5);padding-left:14px;border-left:2px solid rgba(78,200,240,0.12);}
.substep-select{
  background:rgba(4,28,50,0.9);color:var(--light);border:1px solid rgba(78,200,240,0.15);
  padding:5px 10px;border-radius:6px;font-size:11px;min-width:140px;
  font-family:'Satoshi',sans-serif;cursor:pointer;transition:border-color 0.2s;
}
.substep-select:focus{outline:none;border-color:var(--cyan);}
.substep-select.st-complete,.substep-select.st-done,.substep-select.st-approved{border-color:var(--green);color:var(--green);}
.substep-select.st-inprogress,.substep-select.st-send{border-color:var(--amber);color:var(--amber);}
.substep-select.st-fail{border-color:var(--red);color:#ff6b6b;}
.substep-select.st-notstarted{border-color:rgba(255,255,255,0.08);color:rgba(255,255,255,0.35);}
.substep-select.st-route{border-color:rgba(139,92,246,0.4);color:#a78bfa;background:rgba(139,92,246,0.08);}
.route-row{background:rgba(139,92,246,0.04);border-radius:6px;margin:4px 0;padding:8px 0 8px 4px;}
.route-row .substep-label{color:#a78bfa;font-weight:600;}
.route-chosen{opacity:0.7;font-size:11px;}
.route-chosen .substep-label{font-size:11px;}
.cod-da-header{border-bottom:2px solid rgba(139,92,246,0.15);margin-bottom:4px;padding-bottom:10px;}
/* === SP STATUS DROPDOWN === */
.sp-status-row{display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid rgba(78,200,240,0.08);}
.sp-status-label{font-size:12px;color:rgba(255,255,255,0.5);font-weight:600;}
.sp-status-select{background:rgba(4,28,50,0.9);color:var(--cyan);border:1px solid rgba(78,200,240,0.3);padding:6px 12px;border-radius:6px;font-size:12px;font-family:'Satoshi',sans-serif;cursor:pointer;font-weight:600;}
.sp-status-select:focus{outline:none;border-color:var(--cyan);}
/* === REQUEST INFO BLOCK === */
.req-info{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;padding:14px 20px;border-bottom:1px solid rgba(78,200,240,0.08);background:rgba(78,200,240,0.02);}
.req-info-row{display:flex;flex-direction:column;gap:3px;}
.req-info-full{grid-column:1 / -1;}
.req-info-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--cyan);opacity:0.8;}
.req-info-val{font-size:13px;color:var(--light);word-break:break-word;}
.req-info-details{font-size:12px;line-height:1.5;color:rgba(255,255,255,0.65);white-space:pre-wrap;}
.req-info-attach{display:flex;flex-wrap:wrap;gap:8px;}
.attach-link{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--cyan);text-decoration:none;padding:4px 10px;background:rgba(78,200,240,0.08);border:1px solid rgba(78,200,240,0.2);border-radius:6px;transition:all 0.2s;}
.attach-link:hover{background:rgba(78,200,240,0.16);border-color:var(--cyan);transform:translateY(-1px);}
.info-empty{font-size:12px;color:rgba(255,255,255,0.3);font-style:italic;}
.req-person{display:inline-flex;align-items:center;font-size:13px;color:var(--cyan);cursor:pointer;text-decoration:none;font-weight:600;border-bottom:1px dashed rgba(78,200,240,0.4);transition:all 0.2s;}
.req-person:hover{color:#7dd8f5;border-bottom-color:var(--cyan);}
.step-eta{display:inline-block;margin-left:8px;font-size:10px;font-weight:600;color:var(--amber);background:rgba(240,160,48,0.12);padding:1px 7px;border-radius:8px;vertical-align:middle;}
.sla-note{padding:8px 20px;font-size:11px;color:rgba(255,255,255,0.45);border-bottom:1px solid rgba(78,200,240,0.06);display:flex;align-items:center;gap:6px;}
.sla-note svg{flex-shrink:0;}
body.light-mode .sla-note{color:#4a5568;}
body.light-mode .req-info-val{color:#1a202c;}
body.light-mode .req-info-details{color:#4a5568;}
@media(max-width:768px){
  .header,.toolbar{flex-direction:column;gap:10px;padding:12px 16px;}
  .filters{flex-wrap:wrap;}.request-list{padding:12px 16px;}
}
/* === NOTIFICATION BANNER === */
.notification-banner{
  position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:1000;
  background:rgba(13,49,88,0.95);border:1px solid var(--cyan);border-radius:8px;
  padding:12px 20px;display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);animation:slideDown 0.3s ease;
  max-width:90vw;
}
@keyframes slideDown{from{opacity:0;transform:translateX(-50%) translateY(-20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.notif-text{font-size:13px;color:var(--light);}
.notif-text strong{color:var(--cyan);}
.notif-close{background:none;border:none;color:rgba(255,255,255,0.5);font-size:16px;cursor:pointer;padding:0 4px;}
.notif-close:hover{color:var(--white);}
/* === PRESENCE BADGE === */
.presence-badge{
  font-size:11px;color:var(--cyan);font-weight:600;
  margin-left:10px;padding:2px 8px;
  background:rgba(78,200,240,0.1);border-radius:8px;
  border:1px solid rgba(78,200,240,0.3);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.changed-by{
  font-size:10px;color:rgba(78,200,240,0.7);font-weight:600;
  margin-left:8px;font-style:italic;
}
/* === PROGRESS BAR === */
.progress-track{width:100%;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;margin:6px 20px 0;position:relative;}

// ============================================================
// DATA: Fetch directly from SharePoint REST API (browser session)
// Your browser already has the auth cookie from being logged into SharePoint.
// We just call the API — no login popup, no tokens, no MSAL needed.
// ============================================================
async function fetchAndRender() {
    updateSync('Loading data...');
    try {
        let rawRequests;
        
        // Try Power Automate (live SharePoint data) first
        if (CONFIG.getRequestsUrl) {
            try {
                const paRes = await fetch(CONFIG.getRequestsUrl, { method: 'POST' });
                if (paRes.ok) {
                    const paData = await paRes.json();
                    window._rawPA = paData.value || paData; // debug: raw items from Power Automate
                    // Power Automate returns SharePoint items directly
                    rawRequests = (paData.value || paData).map(item => {
                        // Handle requestType: can be string, array of strings, array of objects, or object
                        let reqType = item.RequestType || item.Request_x0020_Type || item.OData__x0052_equestType || 'Unknown';
                        if (Array.isArray(reqType)) {
                            reqType = reqType.map(t => {
                                if (typeof t === 'object' && t !== null) return t.Value || t.Label || t.value || JSON.stringify(t);
                                return String(t);
                            }).join(';#');
                        } else if (typeof reqType === 'object' && reqType !== null) {
                            if (reqType.results) reqType = reqType.results.map(t => typeof t === 'object' ? (t.Value || t.Label || '') : String(t)).join(';#');
                            else reqType = reqType.Value || reqType.Label || JSON.stringify(reqType);
                        } else {
                            reqType = String(reqType);
                        }
                        
                        // Handle status: can be string or object
                        let status = item.Status || '';
                        if (typeof status === 'object' && status !== null) status = status.Value || status.Label || '';
                        else status = String(status || '');
                        
                        // Assigned BD (real SP field is iGOAdminOnly_x002d_AssignedTo; fallbacks: AssignedFCELead)
                        let assignedBD = item.iGOAdminOnly_x002d_AssignedTo || item.AssignedFCELead || item.AssignedBD || item.Assigned_x0020_BD || '';
                        if (Array.isArray(assignedBD)) assignedBD = assignedBD.map(p => typeof p==='object'?(p.DisplayName||p.Email||''):String(p)).join(', ');
                        else if (typeof assignedBD === 'object' && assignedBD !== null) assignedBD = assignedBD.DisplayName || assignedBD.Email || '';
                        else assignedBD = String(assignedBD || '');
                        
                        // Details
                        let details = item.Details || item.OData__x0044_etails || '';
                        details = String(details || '').replace(/<[^>]*>/g, ' ').trim();
                        
                        // Attachments — Power Automate can send these in several shapes:
                        //  - item.Attachments as array of {DisplayName, Uri} (from "Get attachments")
                        //  - item.AttachmentFiles as array of {FileName, ServerRelativeUrl}
                        //  - a custom column named e.g. item.AttachmentsData
                        let attachments = [];
                        // Case A: nested array (Get attachments as sub-array)
                        const attSource = (Array.isArray(item.Attachments) && item.Attachments)
                            || (Array.isArray(item.AttachmentFiles) && item.AttachmentFiles)
                            || (Array.isArray(item.AttachmentsData) && item.AttachmentsData)
                            || (item.AttachmentFiles && Array.isArray(item.AttachmentFiles.results) && item.AttachmentFiles.results)
                            || null;
                        if (attSource) {
                            attachments = attSource.map(a => {
                                let url = a.Uri || a.ServerRelativeUrl || a.AbsoluteUri || a.link || a.Link || a.url || '#';
                                if (url.startsWith('/')) url = 'https://intel.sharepoint.com' + url;
                                return { name: a.DisplayName || a.Name || a.FileName || a.title || 'file', url: url };
                            });
                        }
                        // Case B: The flow does NOT return the actual attachment filenames.
                        // All we reliably know is {HasAttachments} and {Link} (the request form URL).
                        // So when the request has attachments, link to the request itself — the user
                        // scrolls to the Attachments section and opens the file from there.
                        if (attachments.length === 0) {
                            const itemId = item.ID || item.Id;
                            const hasAtt = item['{HasAttachments}'] === true || item['{HasAttachments}'] === 'true';
                            let reqLink = item['{Link}'] || '';
                            if (!reqLink && itemId) {
                                reqLink = 'https://intel.sharepoint.com/sites/ifs-igo-requests/Lists/New%20DA%20Request/DispForm.aspx?ID=' + itemId;
                            }
                            if (hasAtt && reqLink) {
                                attachments = [{ name: 'View attachment(s)', url: reqLink }];
                            }
                        }
                        
                        // Requestor email (for mailto). Try Email, then extract from Claims.
                        let requestorEmail = '';
                        if (item.Author && typeof item.Author === 'object') {
                            requestorEmail = item.Author.Email || item.Author.UserPrincipalName || item.Author.Mail || '';
                            // Claims looks like "i:0#.f|membership|raman.nayyar@intel.com"
                            if (!requestorEmail && item.Author.Claims) {
                                const m = String(item.Author.Claims).match(/[\w.\-]+@[\w.\-]+/);
                                if (m) requestorEmail = m[0];
                            }
                        }
                        requestorEmail = requestorEmail || item.Author_x0020_Email || '';
                        // Last resort: if DisplayName is "Last, First" build first.last@intel.com is NOT reliable — leave blank.

                        return {
                            id: item.ID || item.Id,
                            requestType: reqType,
                            customer: item.Title || item.Company || '',
                            requestor: item.Author ? (item.Author.DisplayName || item.Author.Title || '') : (item.Created_x0020_By || ''),
                            requestorEmail: requestorEmail,
                            created: item.Created || '',
                            status: status,
                            projectName: item.Project_x002f_PortalName || '',
                            assignedBD: assignedBD,
                            details: details,
                            attachments: attachments
                        };
                    });
                    console.log('Loaded ' + rawRequests.length + ' from SharePoint via Power Automate');
                }
            } catch(e) {
                console.warn('Power Automate fetch failed, falling back to JSON:', e.message);
            }
        }
        
        // Fallback: load from local JSON file
        if (!rawRequests) {
            const reqRes = await fetch(CONFIG.dataFile + '?v=' + Date.now());
            if (!reqRes.ok) throw new Error('Cannot load ' + CONFIG.dataFile);
            rawRequests = await reqRes.json();
        }
        
        // SPLIT multi-service requests: "Code Name Request;#Portal creation;#New DA"
        // becomes 3 separate entries with the same ID
        allRequests = [];
        rawRequests.forEach(r => {
            let rawType = r.requestType || 'Unknown';
            // Ensure it's a string — handle arrays of objects from Power Automate
            if (Array.isArray(rawType)) {
                rawType = rawType.map(t => {
                    if (typeof t === 'object' && t !== null) return t.Value || t.Label || t.value || '';
                    return String(t);
                }).filter(t => t).join(';#');
            } else if (typeof rawType === 'object' && rawType !== null) {
                if (rawType.results) rawType = rawType.results.map(t => typeof t === 'object' ? (t.Value || t.Label || '') : String(t)).join(';#');
                else rawType = rawType.Value || rawType.Label || String(rawType);
            } else {
                rawType = String(rawType);
            }
            
            let types;
            // Handle JSON array format: ["DA edit","COD"]
            if (rawType.startsWith('[')) {
                try { types = JSON.parse(rawType); } catch(e) { types = [rawType]; }
            } else {
                // Handle ;# separator format: DA edit;#COD
                types = rawType.split(';#');
            }
            types.forEach(t => {
                const normalizedType = normalizeType(String(t).trim());
                if (normalizedType) {
                    allRequests.push({ ...r, requestType: normalizedType });
                }
            });
        });

        await loadTracking();
        
        // Sync SharePoint status to internal sub-steps
        syncSpStatusToSubSteps();
        
        const now = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
        updateSync(rawRequests.length + ' requests (' + allRequests.length + ' services) \u00b7 ' + now);
        ensureUsername();
        renderRequests();
        startAutoRefresh();
        startRealtimePolling();
    } catch(err) {
        console.error('Fetch failed:', err);
        updateSync('Load failed \u2014 showing demo data');
        loadDemoData();
    }
}

// Normalize request type names to standard categories
function normalizeType(type) {
    if (!type || typeof type !== 'string') return null;
    if (type === '[object Object]' || type === 'undefined' || type === 'null') return null;
    const t = type.toLowerCase();
    if (t.includes('portal creation') || t === 'portal creation') return 'Portal Creation';
    if (t.includes('new da') || t === 'new da') return 'New DA';
    if (t.includes('code name') || t.includes('codename')) return 'Codename';
    if (t.includes('webview') || t.includes('ags role')) return 'WebView AGS Role';
    if (t.includes('portal unencryption') || t.includes('unecrypted')) return 'Portal Unencryption';
    if (t.includes('secure chamber')) return 'Secure Chamber';
    if (t.includes('ifs nda')) return 'IFS NDA';
    if (t.includes('mp-nda')) return 'MP-NDA';
    if (t.includes('da edit')) return 'DA Edit';
    if (t.includes('cod') && !t.includes('code')) return 'COD';
    if (t.includes('docusign')) return 'DocuSign Request';
    if (t.includes('redbook')) return 'Redbook Release';
    if (t.includes('collateral')) return 'Collateral List Change';
    if (t.includes('add product') || t.includes('new product')) return 'Add Product';
    if (t.includes('portal addition')) return 'Portal Addition';
    if (t.includes('mrunda')) return 'MRUNDA';
    if (t.includes('mpa-ic')) return 'MPA-IC';
    if (t.includes('ext. spo')) return 'Ext. SPO';
    if (t.includes('new folder')) return 'New Folder in SFT';
    // If it doesn't match known types, keep as-is
    return type.trim();
}

// ============================================================
// TRACKING: Firebase Realtime Database — instant sync + notifications
// ============================================================
const FIREBASE_DB = 'https://fs-request-tracker-default-rtdb.firebaseio.com';
const ALLOWED_USERS = ['jair', 'jenn'];
let currentUser = localStorage.getItem('fs-username') || '';

function ensureUsername() {
    // Check if blocked
    const blockUntil = localStorage.getItem('fs-blocked-until');
    if (blockUntil && Date.now() < parseInt(blockUntil)) {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#041c32;color:#ff6b6b;font-family:sans-serif;font-size:1.5rem;text-align:center;padding:2rem;">Access blocked. Too many failed attempts.<br>Try again in 24 hours.</div>';
        throw new Error('Blocked');
    }
    
    if (!currentUser) {
        let attempts = parseInt(localStorage.getItem('fs-login-attempts') || '0');
        const name = prompt('Enter your name to access (authorized users only):');
        
        if (!name || !ALLOWED_USERS.includes(name.toLowerCase().trim())) {
            attempts++;
            localStorage.setItem('fs-login-attempts', String(attempts));
            
            if (attempts >= 3) {
                localStorage.setItem('fs-blocked-until', String(Date.now() + 86400000));
                document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#041c32;color:#ff6b6b;font-family:sans-serif;font-size:1.5rem;text-align:center;padding:2rem;">Access blocked. Too many failed attempts.<br>Try again in 24 hours.</div>';
                throw new Error('Blocked after 3 attempts');
            }
            
            alert('Access denied. Attempt ' + attempts + ' of 3.');
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#041c32;color:#ff6b6b;font-family:sans-serif;font-size:1.5rem;">Access denied. Unauthorized user.</div>';
            throw new Error('Unauthorized');
        }
        
        currentUser = name.trim().charAt(0).toUpperCase() + name.trim().slice(1).toLowerCase();
        localStorage.setItem('fs-username', currentUser);
        localStorage.setItem('fs-login-attempts', '0');
    }
    return currentUser;
}

async function loadTracking() {
    try {
        const res = await fetch(`${FIREBASE_DB}/tracking.json`);
        if (res.ok) {
            const data = await res.json();
            if (data) trackingData = data;
        }
    } catch(e) {
        const saved = localStorage.getItem('ifs-tracker-data');
        if (saved) trackingData = JSON.parse(saved);
    }
}

async function saveTracking() {
    trackingData._lastSaved = new Date().toISOString();
    trackingData._lastUser = currentUser;
    localStorage.setItem('ifs-tracker-data', JSON.stringify(trackingData));
    
    try {
        await fetch(`${FIREBASE_DB}/tracking.json`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(trackingData)
        });
    } catch(e) {
        console.warn('Firebase save failed:', e);
    }
}

// Update SharePoint via Power Automate
const POWER_AUTOMATE_URL = 'https://default46c98d88e3444ed484964ed7712e25.5d.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/40cbbde7f15d421caec3dc9010603c4c/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=32PeIbodqnXtws5Le8SmNHeMBLaXWEmueKq9uZHEiZk';

async function updateSharePoint(requestId, newStatus) {
    try {
        const res = await fetch(POWER_AUTOMATE_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id: parseInt(requestId), status: newStatus })
        });
        if (res.ok) {
            console.log('SharePoint updated: #' + requestId + ' -> ' + newStatus);
        } else {
            console.warn('SharePoint update response:', res.status);
        }
    } catch(e) {
        console.warn('Power Automate call:', e.message);
    }
}

// Direct SharePoint status change from dropdown
async function changeSpStatus(id, newStatus, selectEl) {
    if (!newStatus) return;
    console.log('Sending to SharePoint: #' + id + ' -> ' + newStatus);
    if (selectEl) selectEl.disabled = true;
    await updateSharePoint(id, newStatus);
    if (selectEl) selectEl.disabled = false;
    // Update local data so the badge reflects the change
    allRequests.forEach(r => { if (String(r.id) === String(id)) r.status = newStatus; });
    // Log it
    logHistory(id, '', 'SharePoint Status', 'Status', newStatus);
    // Auto-emails on status change
    const st = String(newStatus).toLowerCase();
    if (st === 'acknowledged') {
        openAcknowledgedEmail(id);
    } else if (st === 'info requested') {
        openInfoRequestEmail(id);
    }
}

    const reqs = allRequests.filter(r => String(r.id) === String(id));
    if (!reqs.length) return;
    const req0 = reqs[0];

    const TEST_MODE = false; // false = LIVE (to requestor, CC fs.da.ops)
    const to = TEST_MODE ? 'jair.garcia@intel.com' : (req0.requestorEmail || '');
    const cc = 'fs.da.ops@intel.com';

// Poll for changes every 5 seconds
let lastChangeTimestamp = '';
let presenceData = {};

function startRealtimePolling() {
    setInterval(async () => {
        // 1. Check last change notification
        try {
            const res = await fetch(`${FIREBASE_DB}/lastChange.json`);
            if (res.ok) {
                const data = await res.json();
                if (data && data.timestamp !== lastChangeTimestamp && data.user !== currentUser) {
                    lastChangeTimestamp = data.timestamp;
                    showNotification(data);
                } else if (data) {
                    lastChangeTimestamp = data.timestamp;
                }
            }
        } catch(e) {}
        
        // 2. Load viewing data (who has which request open)
        try {
            const res = await fetch(`${FIREBASE_DB}/viewing.json`);
            if (res.ok) {
                const viewingData = await res.json() || {};
                // Highlight cards that someone else has open
                document.querySelectorAll('.group-card').forEach(card => {
                    card.classList.remove('being-viewed');
                    const badge = card.querySelector('.viewing-badge');
                    if (badge) badge.remove();
                });
                const now = new Date().getTime();
                Object.entries(viewingData).forEach(([id, val]) => {
                    if (!val || val.user === currentUser) return;
                    // Only show if less than 2 minutes old
                    if (now - new Date(val.since).getTime() > 120000) return;
                    const card = document.getElementById('group-' + id);
                    if (card) {
                        card.classList.add('being-viewed');
                        if (!card.querySelector('.viewing-badge')) {
                            const badge = document.createElement('span');
                            badge.className = 'viewing-badge';
                            badge.textContent = val.user;
                            card.appendChild(badge);
                        }
                    }
                });
            }
        } catch(e) {}
        
        // 3. Reload tracking silently — do NOT re-render (causes cards to close)
        // Only re-render if there's a new change from another user
        const oldLastSaved = trackingData._lastSaved || '';
        await loadTracking();
        if (trackingData._lastSaved !== oldLastSaved && trackingData._lastUser !== currentUser) {
            // Save which cards are open
            const openCards = [];
            document.querySelectorAll('.group-card.open').forEach(c => openCards.push(c.id));
            renderRequests();
            // Restore open state
            openCards.forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('open'); });
        }
    }, 5000);
}

// ============================================================
// SYNC SP STATUS TO INTERNAL SUB-STEPS
// If SharePoint says "Out for Signature", make sure the corresponding
// internal sub-step also reflects that (e.g., COD → Send for Signature)
// ============================================================
function syncSpStatusToSubSteps() {
    const grouped = groupByID(allRequests);
    let changed = false;
    
    Object.entries(grouped).forEach(([id, reqs]) => {
        if (!reqs[0]) return;
        const spStatus = String(reqs[0].status || '').trim();
        if (!spStatus || spStatus === 'Not Started') return;
        
        reqs.forEach(r => {
            const key = id + '-' + r.requestType;
            const steps = SUB_STEPS[r.requestType] || [];
            if (steps.length === 0) return;
            if (!trackingData[key]) trackingData[key] = {};
            const saved = trackingData[key];
            
            // Map SP status to internal step values
            if (spStatus === 'Out for Signature') {
                // COD: set Send for Signature
                if (r.requestType === 'COD' && (!saved['cod-send-signature'] || saved['cod-send-signature'] === 'Not Started')) {
                    saved['cod-send-signature'] = 'Send for Signature';
                    changed = true;
                }
                // New DA: set Add for Signature in progress
                if (r.requestType === 'New DA' && (!saved['add-force-signature'] || saved['add-force-signature'] === 'Not Started')) {
                    saved['acknowledge'] = saved['acknowledge'] || 'Complete';
                    saved['in-approval-loop'] = saved['in-approval-loop'] || 'Complete';
                    saved['add-force-signature'] = 'In Progress';
                    changed = true;
                }
            } else if (spStatus === 'In Approval Loop') {
                if (r.requestType === 'New DA' && (!saved['in-approval-loop'] || saved['in-approval-loop'] === 'Not Started')) {
                    saved['acknowledge'] = saved['acknowledge'] || 'Complete';
                    saved['in-approval-loop'] = 'In Progress';
                    changed = true;
                }
                if (r.requestType === 'DA Edit' && (!saved['da-edit-approval-loop'] || saved['da-edit-approval-loop'] === 'Not Started')) {
                    saved['da-edit-approval-loop'] = 'In Progress';
                    changed = true;
                }
            } else if (spStatus === 'Acknowledged') {
                if (r.requestType === 'New DA' && (!saved['acknowledge'] || saved['acknowledge'] === 'Not Started')) {
                    saved['acknowledge'] = 'Complete';
                    changed = true;
                }
            } else if (spStatus === 'Complete') {
                // All steps complete
                steps.forEach(s => {
                    if (!saved[s.id] || saved[s.id] === 'Not Started' || saved[s.id] === 'In Progress') {
                        if (s.id === 'ags-approved-role') saved[s.id] = 'Approved';
                        else if (s.id === 'cod-send-signature') saved[s.id] = 'Complete';
                        else saved[s.id] = 'Complete';
                        changed = true;
                    }
                });
            } else if (spStatus === 'WIP') {
                // At least first step should be in progress
                if (steps.length > 0 && (!saved[steps[0].id] || saved[steps[0].id] === 'Not Started')) {
                    saved[steps[0].id] = 'In Progress';
                    changed = true;
                }
            } else if (spStatus === 'Info Requested') {
                // For COD/DA Edit combo, set info request
                const comboKey = id + '-cod-da-route';
                if (!trackingData[comboKey]) trackingData[comboKey] = {};
                if (!trackingData[comboKey]['info-request'] || trackingData[comboKey]['info-request'] === 'Not Started') {
                    trackingData[comboKey]['info-request'] = 'In Progress';
                    changed = true;
                }
            }
        });
    });
    
    if (changed) saveTracking();
}

function toggleStatFilter(status) {
    if (status === 'all') {
        // Click "total" = show all, clear other selections
        activeStatFilters = new Set(['all']);
    } else {
        // Remove 'all' if selecting specific filters
        activeStatFilters.delete('all');
        
        if (activeStatFilters.has(status)) {
            activeStatFilters.delete(status);
        } else {
            activeStatFilters.add(status);
        }
        
        // If nothing selected, go back to all
        if (activeStatFilters.size === 0) activeStatFilters = new Set(['all']);
    }
    
    // Update visual active state
    document.getElementById('stat-total').classList.toggle('stat-active', activeStatFilters.has('all'));
    document.getElementById('stat-progress').classList.toggle('stat-active', activeStatFilters.has('in-progress'));
    document.getElementById('stat-complete').classList.toggle('stat-active', activeStatFilters.has('complete'));
    document.getElementById('stat-new').classList.toggle('stat-active', activeStatFilters.has('not-started'));
    
    // Also sync the dropdown filter
    document.getElementById('filter-status').value = 'all';
    
    renderRequests();
}

// ============================================================
// RENDERING: Group by ID — one card per request ID
// ============================================================
function groupByID(requests) {
    const map = {};
    requests.forEach(r => {
        if (!r.id) return; // skip items without valid ID
        const id = String(r.id);
        if (!map[id]) map[id] = [];
        map[id].push(r);
    });
    return map;
}

function renderRequests() {
    const container = document.getElementById('request-list');
    const typeFilter = document.getElementById('filter-type').value;
    const search = document.getElementById('search-box').value.toLowerCase();

    // Filter only 2026 requests
    let filtered = allRequests.filter(r => {
        if (!r.created) return false;
        const year = new Date(r.created).getFullYear();
        return year === 2026;
    });

    // Time filter
    filtered = filterByTime(filtered);

    if (typeFilter !== 'all') filtered = filtered.filter(r => r.requestType === typeFilter);
    if (search) filtered = filtered.filter(r =>
        (r.customer||'').toLowerCase().includes(search) ||
        String(r.id).includes(search)
    );

    const grouped = groupByID(filtered);

    // Stats
    const allGrouped = groupByID(filtered);
    let totalGroups = Object.keys(allGrouped).length;
    let wipCount = 0, doneCount = 0, newCount = 0;
    Object.entries(allGrouped).forEach(([id, reqs]) => {
        const s = getGroupOverall(id, reqs);
        if (s==='complete') doneCount++;
        else if (s==='in-progress') wipCount++;
        else newCount++;
    });
    document.getElementById('stat-total').textContent = totalGroups + ' total';
    document.getElementById('stat-progress').textContent = wipCount + ' WIP';
    document.getElementById('stat-complete').textContent = doneCount + ' done';
    document.getElementById('stat-new').textContent = newCount + ' new';

    // Filter by overall status (from pills or dropdown)
    let ids = Object.keys(grouped);
    const statusFilter = document.getElementById('filter-status').value;
    
    if (!activeStatFilters.has('all')) {
        ids = ids.filter(id => activeStatFilters.has(getGroupOverall(id, grouped[id])));
    } else if (statusFilter !== 'all') {
        ids = ids.filter(id => getGroupOverall(id, grouped[id]) === statusFilter);
    }

    // Sort
    ids = sortIds(ids, grouped);

    if (ids.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No requests match filters</h3></div>';
        return;
    }

    // Pagination (50 per page)
    const PAGE_SIZE = 50;
    const totalPages = Math.ceil(ids.length / PAGE_SIZE);
    const currentPage = window._currentPage || 1;
    const startIdx = (currentPage - 1) * PAGE_SIZE;
    const pageIds = ids.slice(startIdx, startIdx + PAGE_SIZE);

    let html = pageIds.map(id => renderGroupCard(id, grouped[id])).join('');
    
    // Pagination controls
    if (totalPages > 1) {
        html += `<div class="pagination">
          <button onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>Prev</button>
          <span>Page ${currentPage} of ${totalPages} (${ids.length} requests)</span>
          <button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>
        </div>`;
    }
    
    container.innerHTML = html;
}

function buildRequestEmail(id, reqs) {
    const req0 = reqs[0] || {};
    const email = req0.requestorEmail || '';
    const name = (req0.requestor || 'there').split(' ')[0];
    const customer = req0.customer || 'the customer';
    const types = reqs.filter(r => r.requestType !== 'Unknown').map(r => r.requestType);

    // Always CC Jenn
    const cc = 'jenn.glavan@intel.com';

    // Subject: REQ. XXXX - Company - Info request
    const subject = `REQ. ${id} - ${customer} - Info request`;

    // Body — @FirstName so Outlook can turn it into a mention when you press space after it
    let body = `Hi @${name},\n\n`;
    body += `Thank you for your request. In order to proceed, you are required to fill out the template as follows and attach it back to your request:\n\n`;

    const has = t => types.some(x => x.toLowerCase() === t.toLowerCase());

    if (has('New DA')) {
        body += `New DA — please fill out this template.\nLink: ${EMAIL_LINKS.newDA}\n\n`;
    }
    if (has('DA Edit')) {
        body += `DA Edit — please fill out this template.\nLink: ${EMAIL_LINKS.newDA}\n\n`;
    }
    if (has('IFS NDA')) {
        body += `IFS NDA — please fill out this template.\nLink: ${EMAIL_LINKS.ifsNDA}\n\n`;
    }
    if (has('Codename')) {
        body += `Codename Request — please fill out the following template with the customer attachment information:\n\n`;
        body += `Company Name:\nCompany Type (Supplier / Customer):\nCompany Address:\nCity:\nState:\nCountry:\nPostal Code:\nSupplier Site (points if it is a supplier):\nCompany Email Domain:\nOwner / Submitter Name:\n\n`;
    }

    body += `Please fill the template and attach it to your request so we can proceed.\n\nThank you,\nDA Ops`;

    return `mailto:${encodeURIComponent(email)}?cc=${encodeURIComponent(cc)}&subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function renderGroupCard(id, reqs) {
    if (!reqs || reqs.length === 0) return '';
    const customer = reqs[0].customer || '\u2014';
    const date = reqs[0].created ? new Date(reqs[0].created).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '';
    const overall = getGroupOverall(id, reqs);
    const sourceStatus = String(reqs[0].status || '');
    const knownReqs = reqs.filter(r => r.requestType !== 'Unknown');
    const badges = knownReqs.map(r => `<span class="badge badge-${getBadgeClass(r.requestType)}">${r.requestType}</span>`).join('');
    const statusBadge = sourceStatus ? `<span class="badge badge-nda" style="font-style:italic;">${sourceStatus}</span>` : '';

    // Age badge
    const ageDays = getAgeDays(reqs[0].created);
    const ageBadge = (overall !== 'complete') ? getAgeBadge(ageDays) : '';

    // Progress bar
    const progress = getProgressPercent(id, reqs);
    const pfClass = overall === 'complete' ? 'pf-done' : overall === 'failed' ? 'pf-fail' : progress > 0 ? 'pf-wip' : 'pf-new';

    // Notes
    const noteData = (trackingData._notes && trackingData._notes[id]) || {};
    const noteText = noteData.text || '';
    const noteBy = noteData.by ? ` (${noteData.by})` : '';

    // Request info block (from SharePoint): Created By, Assigned BD, Details, Attachments
    const createdBy = reqs[0].requestor || '\u2014';
    const assignedBD = reqs[0].assignedBD || '\u2014';
    const details = reqs[0].details || '';
    const attachments = Array.isArray(reqs[0].attachments) ? reqs[0].attachments : [];
    const attachmentsHtml = attachments.length
        ? attachments.map(a => `<a class="attach-link" href="${a.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg width="12" height="12" viewBox="0 0 16 16"><path d="M9,3 L4,8 a2.5,2.5 0 0 0 3.5,3.5 L13,6 a1.5,1.5 0 0 0 -2,-2 L6,9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>${a.name}</a>`).join('')
        : '<span class="info-empty">No attachments</span>';
    const createdByHtml = createdBy && createdBy !== '\u2014'
        ? `<a class="req-person" title="Click to email ${createdBy}" onclick="event.stopPropagation();openRequestEmail('${id}')">${createdBy}<svg width="12" height="12" viewBox="0 0 16 16" style="margin-left:5px;"><rect x="1.5" y="3" width="13" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><polyline points="2,4 8,9 14,4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>`
        : `<span class="req-info-val">${createdBy}</span>`;
    const infoBlock = `<div class="req-info">
      <div class="req-info-row"><span class="req-info-label">Created By</span><span class="req-info-val">${createdByHtml}</span></div>
      <div class="req-info-row"><span class="req-info-label">Assigned BD</span><span class="req-info-val">${assignedBD}</span></div>
      <div class="req-info-row req-info-full"><span class="req-info-label">Details</span><span class="req-info-val req-info-details">${details ? details : '<span class="info-empty">No details</span>'}</span></div>
      <div class="req-info-row req-info-full"><span class="req-info-label">Attachments</span><span class="req-info-val req-info-attach">${attachmentsHtml}</span></div>
    </div>`;

    // Handle COD/DA Edit combo: shared info request + route selector ABOVE the sections
    const hasCOD = knownReqs.some(r => r.requestType === 'COD');
    const hasDAEdit = knownReqs.some(r => r.requestType === 'DA Edit');
    const isCodDaCombo = hasCOD && hasDAEdit;
    
    let codDaHeader = '';
    let filteredReqs = knownReqs;
    
    if (isCodDaCombo) {
        const comboKey = id + '-cod-da-route';
        const saved = trackingData[comboKey] || {};
        const infoStatus = saved['info-request'] || 'Not Started';
        const routeChoice = saved['route'] || 'Waiting for BD';
        const infoBy = saved['info-request_by'] || '';
        const routeBy = saved['route_by'] || '';
        const infoCls = selectClass(infoStatus);
        const routeCls = 'st-route';
        
        codDaHeader = `<div class="type-section cod-da-header">
          <div class="type-section-header"><span class="type-section-title title-codename">COD / DA Edit Decision</span></div>
          <div class="substep-row">
            <span class="substep-label">Info Request to BD</span>
            <select class="substep-select ${infoCls}" onchange="updateCodDaRoute('${id}','info-request',this.value)">
              <option value="Not Started"${infoStatus==='Not Started'?' selected':''}>Not Started</option>
              <option value="In Progress"${infoStatus==='In Progress'?' selected':''}>In Progress</option>
              <option value="Done"${infoStatus==='Done'?' selected':''}>Done</option>
            </select>
            ${infoBy ? '<span class="changed-by">'+infoBy+'</span>' : ''}
          </div>
          <div class="substep-row route-row">
            <span class="substep-label">\u25C7 Route</span>
            <select class="substep-select ${routeCls}" onchange="updateCodDaRoute('${id}','route',this.value)">
              <option value="Waiting for BD"${routeChoice==='Waiting for BD'?' selected':''}>Waiting for BD</option>
              <option value="COD"${routeChoice==='COD'?' selected':''}>COD</option>
              <option value="DA Edit"${routeChoice==='DA Edit'?' selected':''}>DA Edit</option>
            </select>
            ${routeBy ? '<span class="changed-by">'+routeBy+'</span>' : ''}
          </div>
        </div>`;
        
        // Filter: only show the chosen path
        if (routeChoice === 'COD') {
            filteredReqs = knownReqs.filter(r => r.requestType !== 'DA Edit');
        } else if (routeChoice === 'DA Edit') {
            filteredReqs = knownReqs.filter(r => r.requestType !== 'COD');
        } else {
            // Waiting — hide both COD and DA Edit sections
            filteredReqs = knownReqs.filter(r => r.requestType !== 'COD' && r.requestType !== 'DA Edit');
        }
    }
    
    // Order sections: New DA first, then Portal Creation, then everything else
    const TYPE_ORDER = ['New DA', 'Portal Creation'];
    filteredReqs = filteredReqs.slice().sort((a, b) => {
        let ia = TYPE_ORDER.indexOf(a.requestType); if (ia === -1) ia = 99;
        let ib = TYPE_ORDER.indexOf(b.requestType); if (ib === -1) ib = 99;
        return ia - ib;
    });

    const sections = filteredReqs.map(r => renderTypeSection(id, r)).join('');

    // Canceled requests: grey out the whole card with a diagonal-stripe overlay
    const isCanceled = sourceStatus.toLowerCase() === 'canceled' || sourceStatus.toLowerCase() === 'cancelled';
    const canceledClass = isCanceled ? ' canceled' : '';
    const canceledTag = isCanceled ? '<span class="canceled-tag">CANCELED</span>' : '';

    return `<div class="group-card${canceledClass}" id="group-${id}">
      ${canceledTag}
      <div class="group-header" onclick="toggleGroup('${id}')">
        <span class="group-id">#${id}</span>
        <span class="group-customer">${customer}</span>
        <div class="group-badges">${badges}${statusBadge}</div>
        ${ageBadge}
        <span class="group-overall" title="SharePoint status: ${sourceStatus || 'No status'}">${svgIcon(overall)}</span>
        <span class="group-date">${date}</span>
        <span class="chevron">\u203A</span>
      </div>
      <div class="progress-track"><div class="progress-fill ${pfClass}" style="width:${progress}%"></div><span class="progress-pct">${progress}%</span></div>
      <div class="group-body">
        <div class="sp-status-row">
          <span class="sp-status-label">SharePoint Status:</span>
          <select class="sp-status-select" onclick="event.stopPropagation()" onchange="changeSpStatus('${id}',this.value,this)">
            <option value=""${!sourceStatus?' selected':''}>-- Not Set --</option>
            <option value="Info Requested"${sourceStatus==='Info Requested'?' selected':''}>Info Requested</option>
            <option value="Acknowledged"${sourceStatus==='Acknowledged'?' selected':''}>Acknowledged</option>
            <option value="In Approval Loop"${sourceStatus==='In Approval Loop'?' selected':''}>In Approval Loop</option>
            <option value="Out for Signature"${sourceStatus==='Out for Signature'?' selected':''}>Out for Signature</option>
            <option value="WIP"${sourceStatus==='WIP'?' selected':''}>WIP</option>
            <option value="IT Request Submitted"${sourceStatus==='IT Request Submitted'?' selected':''}>IT Request Submitted</option>
            <option value="Complete"${sourceStatus==='Complete'?' selected':''}>Complete</option>
            <option value="On Hold"${sourceStatus==='On Hold'?' selected':''}>On Hold</option>
            <option value="Canceled"${sourceStatus==='Canceled'?' selected':''}>Canceled</option>
          </select>
        </div>
        ${infoBlock}
        <div class="sla-note">
          <svg width="12" height="12"><use href="#icon-progress"/></svg>
          SLA: ~48-56 hrs to move to the next step. In Approval Loop ~2 days, Out for Signature 48-56 hrs (depend on external approvers).
        </div>
        ${codDaHeader}
        ${sections}
        <div class="notes-section">
          <textarea class="notes-input" placeholder="Notes (IT ticket, comments...)${noteBy}" oninput="saveNoteDebounced('${id}',this)" onblur="saveNote('${id}',this)">${noteText}</textarea>
        </div>
        <div class="history-toggle" onclick="loadRequestHistory('${id}',this)">
          <svg width="12" height="12"><use href="#icon-progress"/></svg> View Change History
        </div>
        <div class="history-section" id="history-${id}" style="display:none;"></div>
      </div>
    </div>`;
}

function renderTypeSection(id, req) {
    const key = id + '-' + req.requestType;
    const steps = SUB_STEPS[req.requestType] || [];
    const saved = trackingData[key] || {};
    
    // If the source status from SharePoint is Complete, auto-complete all sub-steps
    const sourceComplete = String(req.status || '').toLowerCase() === 'complete' || String(req.status || '').toLowerCase() === 'canceled';
    
    const sectionOverall = sourceComplete ? 'complete' : getSectionOverall(key, steps);
    const titleClass = 'title-' + getBadgeClass(req.requestType);

    // Determine which route was selected (for COD/DA Edit conditional steps)
    const routeStepId = steps.find(s => s.isRoute);
    const selectedRoute = routeStepId ? (saved[routeStepId.id] || 'Waiting for BD') : null;
    const routeChosen = selectedRoute && selectedRoute !== 'Waiting for BD';

    const rows = steps.map(step => {
        // Once route is chosen: hide steps from the OTHER path
        if (step.showWhen && routeChosen && selectedRoute !== step.showWhen) {
            return '';
        }
        // Once route is chosen: hide info request (already done)
        if (routeChosen && step.id.includes('info-request')) {
            return '';
        }
        
        let val;
        if (sourceComplete) {
            val = step.isRoute ? (saved[step.id] || 'Waiting for BD') : (step.id === 'ags-approved-role') ? 'Approved' : 'Complete';
        } else {
            val = saved[step.id] || (step.isRoute ? 'Waiting for BD' : 'Not Started');
        }
        const cls = step.isRoute ? 'st-route' : selectClass(val);
        const disabled = sourceComplete ? 'disabled' : '';
        const opts = statusOptions(req.requestType, step.id).map(s =>
            `<option value="${s}"${s===val?' selected':''}>${s}</option>`
        ).join('');
        const changedBy = saved[step.id + '_by'] || '';
        const byLabel = (changedBy && val !== 'Not Started' && val !== 'Waiting for BD') ? `<span class="changed-by">${changedBy}</span>` : '';
        
        // Route selector after choosing: show compact with current choice
        if (step.isRoute && routeChosen) {
            return `<div class="substep-row route-row route-chosen">
              <span class="substep-label">\u25C7 Path: <strong>${selectedRoute}</strong> (change \u2192)</span>
              <select class="substep-select st-route" onchange="updateStep('${key}','${step.id}',this.value,this)">${opts}</select>
              ${byLabel}
            </div>`;
        }
        
        const rowClass = step.isRoute ? 'substep-row route-row' : 'substep-row';
        const eta = STEP_ETA[step.id] ? `<span class="step-eta" title="Estimated time for this step">${STEP_ETA[step.id]}</span>` : '';
        return `<div class="${rowClass}">
          <span class="substep-label">${step.isRoute ? '\u25C7 ' : ''}${step.label}${eta}</span>
          <select class="substep-select ${cls}" ${disabled} onchange="updateStep('${key}','${step.id}',this.value,this)">${opts}</select>
          ${byLabel}
        </div>`;
    }).join('');

    return `<div class="type-section">
      <div class="type-section-header">
        <span class="type-section-title ${titleClass}">${req.requestType}</span>
        <span class="section-status">${svgIcon(sectionOverall)} <span>${statusLabel(sectionOverall)}</span></span>
      </div>
      ${rows}
    </div>`;
}

function toggleGroup(id) {
    const card = document.getElementById('group-' + id);
    card.classList.toggle('open');
    if (card.classList.contains('open')) {
        const user = ensureUsername();
        fetch(`${FIREBASE_DB}/viewing/${id}.json`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ user: user, since: new Date().toISOString() })
        }).catch(()=>{});
    } else {
        fetch(`${FIREBASE_DB}/viewing/${id}.json`, { method: 'DELETE' }).catch(()=>{});
    }
}

// COD/DA Edit shared route handler
async function updateCodDaRoute(id, field, value) {
    const comboKey = id + '-cod-da-route';
    if (!trackingData[comboKey]) trackingData[comboKey] = {};
    trackingData[comboKey][field] = value;
    trackingData[comboKey][field + '_by'] = currentUser;
    trackingData[comboKey]._updated = new Date().toISOString();
    await saveTracking();
    
    // Re-render the entire card to show/hide sections
    const card = document.getElementById('group-' + id);
    const wasOpen = card.classList.contains('open');
    const reqs = allRequests.filter(r => String(r.id) === id);
    const grouped = groupByID(reqs);
    const newCard = document.createElement('div');
    newCard.innerHTML = renderGroupCard(id, grouped[id]);
    card.replaceWith(newCard.firstElementChild);
    if (wasOpen) document.getElementById('group-' + id).classList.add('open');
    
    // Log
    const label = field === 'route' ? 'Route Decision' : 'Info Request to BD';
    logHistory(id, reqs[0]?.customer || '', 'COD/DA Edit', label, value);
}

function updateStep(key, stepId, value, el) {
    if (!trackingData[key]) trackingData[key] = {};
    trackingData[key][stepId] = value;
    trackingData[key][stepId + '_by'] = currentUser;
    trackingData[key]._updated = new Date().toISOString();
    trackingData[key]._updatedBy = currentUser;
    el.className = 'substep-select ' + selectClass(value);
    saveTracking();
    
    // Send notification to other users
    const id = key.split('-')[0];
    const reqType = key.substring(id.length + 1);
    const steps = SUB_STEPS[reqType] || [];
    const stepObj = steps.find(s => s.id === stepId);
    const stepLabel = stepObj ? stepObj.label : stepId;
    const req = allRequests.find(r => String(r.id) === id && r.requestType === reqType);
    const customer = req ? req.customer : '';
    logHistory(id, customer, reqType, stepLabel, value);
    setPresence(id, reqType);
    
    // If this is a route change, re-render the entire section
    const isRouteStep = steps.find(s => s.id === stepId && s.isRoute);
    if (isRouteStep) {
        const section = el.closest('.type-section');
        const newSection = document.createElement('div');
        newSection.innerHTML = renderTypeSection(id, req);
        section.replaceWith(newSection.firstElementChild);
    }
    
    // Refresh section status icon
    const section = el.closest('.type-section');
    if (section) {
        const statusSpan = section.querySelector('.section-status');
        const s = getSectionOverall(key, steps);
        if (statusSpan) statusSpan.innerHTML = svgIcon(s) + ' <span>' + statusLabel(s) + '</span>';
    }
    // Refresh group icon + progress bar
    const card = el.closest('.group-card');
    if (card) {
        const reqs = allRequests.filter(r => String(r.id) === id);
        const g = getGroupOverall(id, reqs);
        card.querySelector('.group-overall').innerHTML = svgIcon(g);
        const progress = getProgressPercent(id, reqs);
        const pBar = card.querySelector('.progress-fill');
        const pPct = card.querySelector('.progress-pct');
        if (pBar) { pBar.style.width = progress + '%'; pBar.className = 'progress-fill ' + (g==='complete'?'pf-done':g==='failed'?'pf-fail':progress>0?'pf-wip':'pf-new'); }
        if (pPct) pPct.textContent = progress + '%';
    }
}

function getBadgeClass(type) {

        'DA Edit':'codename','COD':'codename','DocuSign Request':'nda',
        'Redbook Release':'webview'
    };
    return map[type]||'nda';
}

function selectClass(val) {
    const m = {'Complete':'st-complete','Done':'st-done','Approved':'st-approved','In Progress':'st-inprogress','Send for Approval':'st-send','Send for Signature':'st-send','Fail':'st-fail','Not Started':'st-notstarted','Waiting for BD':'st-route','COD':'st-route','DA Edit':'st-route'};
    return m[val]||'st-notstarted';
}

function statusOptions(reqType, stepId) {
    if (stepId === 'ags-approved-role') return ['Not Started','Send for Approval','Approved'];
    if (stepId === 'create-da' || stepId === 'create-portal') return ['Not Started','In Progress','Complete','Fail'];
    if (reqType === 'Portal Creation') return ['Not Started','In Progress','Complete','Fail'];
    if (reqType === 'New DA') {
        if (stepId === 'acknowledge') return ['Not Started','Complete'];
        return ['Not Started','In Progress','Complete'];
    }
    if (stepId === 'cod-route' || stepId === 'da-edit-route') return ['Waiting for BD','COD','DA Edit'];
    if (stepId === 'cod-send-signature') return ['Not Started','Send for Signature','Complete'];
    if (stepId === 'da-edit-info-request' || stepId === 'cod-info-request') return ['Not Started','In Progress','Done'];
    if (stepId === 'da-edit-approval-loop') return ['Not Started','In Progress','Complete'];
    if (stepId === 'da-edit-for-signature') return ['Not Started','In Progress','Complete'];
    return ['Not Started','In Progress','Complete','Done'];
}

function getSectionOverall(key, steps) {
    // If no sub-steps defined for this type, use the source status from Excel
    if (!steps || steps.length === 0) return 'not-started';
    const saved = trackingData[key] || {};
    const vals = steps.map(s => saved[s.id] || 'Not Started');
    if (vals.some(v => v==='Fail')) return 'failed';
    if (vals.every(v => v==='Complete'||v==='Done'||v==='Approved')) return 'complete';
    if (vals.some(v => v!=='Not Started')) return 'in-progress';
    return 'not-started';
}

function getGroupOverall(id, reqs) {
    // First check: if the SOURCE status from SharePoint says Complete/Canceled, use that
    const sourceStatus = String(reqs[0].status || '').toLowerCase();
    if (sourceStatus === 'complete' || sourceStatus === 'canceled') return 'complete';
    if (sourceStatus === 'wip' || sourceStatus === 'in approval loop' || sourceStatus === 'out for signature' || sourceStatus === 'it request submitted') return 'in-progress';
    
    // Otherwise, calculate from tracking sub-steps
    const sectionStatuses = reqs.map(r => {
        const key = id + '-' + r.requestType;
        const steps = SUB_STEPS[r.requestType] || [];
        return getSectionOverall(key, steps);
    });
    if (sectionStatuses.some(s => s==='failed')) return 'failed';
    if (sectionStatuses.every(s => s==='complete')) return 'complete';
    if (sectionStatuses.some(s => s!=='not-started')) return 'in-progress';
    return 'not-started';
}

function statusLabel(s) {
    return {'complete':'Done','in-progress':'In Progress','failed':'Failed','not-started':'New'}[s]||'New';
}

function svgIcon(status) {
    const map = {
        'complete': '<svg width="16" height="16"><use href="#icon-check"/></svg>',
        'in-progress': '<svg width="16" height="16"><use href="#icon-progress"/></svg>',
        'failed': '<svg width="16" height="16"><use href="#icon-fail"/></svg>',
        'not-started': '<svg width="16" height="16"><use href="#icon-new"/></svg>'
    };
    return map[status] || map['not-started'];
}

// ============================================================
// HISTORY: Load and display change history for a request
// ============================================================
async function loadRequestHistory(id, toggleEl) {
    const historyDiv = document.getElementById('history-' + id);
    
    // Toggle visibility
    if (historyDiv.style.display !== 'none') {
        historyDiv.style.display = 'none';
        return;
    }
    historyDiv.style.display = 'block';
    historyDiv.innerHTML = '<div style="font-size:11px;color:rgba(255,255,255,0.3);">Loading...</div>';
    
    try {
        const res = await fetch(`${FIREBASE_DB}/history.json`);
        if (!res.ok) throw new Error('Failed');
        const allHistory = await res.json();
        
        if (!allHistory) {
            historyDiv.innerHTML = '<div style="font-size:11px;color:rgba(255,255,255,0.3);">No history yet</div>';
            return;
        }
        
        // Filter entries for this request ID
        const entries = Object.values(allHistory)
            .filter(h => String(h.requestId) === String(id))
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
            .slice(0, 20); // last 20 changes
        
        if (entries.length === 0) {
            historyDiv.innerHTML = '<div style="font-size:11px;color:rgba(255,255,255,0.3);">No changes recorded</div>';
            return;
        }
        
        historyDiv.innerHTML = entries.map(h => {
            const time = new Date(h.timestamp).toLocaleString('en-US', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
            return `<div class="history-entry">
                <span class="history-time">${time}</span>
                <span><strong>${h.user}</strong> set ${h.requestType} \u2192 ${h.step}: <strong>${h.value}</strong></span>
            </div>`;
        }).join('');
    } catch(e) {
        historyDiv.innerHTML = '<div style="font-size:11px;color:#ff6b6b;">Could not load history</div>';
    }
}

document.addEventListener('keydown', (e) => {
    // Ctrl+E = expand all, Ctrl+W = collapse all
    if (e.ctrlKey && e.key === 'e') { e.preventDefault(); toggleAllCards(true); }
    if (e.ctrlKey && e.key === 'w') { e.preventDefault(); toggleAllCards(false); }
    // Arrow left/right for pagination
    if (e.key === 'ArrowRight' && !e.target.matches('input,textarea,select')) {
        const totalPages = Math.ceil(document.querySelectorAll('.group-card').length > 0 ? 999 : 1);
        goToPage(Math.min((window._currentPage || 1) + 1, totalPages));
    }
    if (e.key === 'ArrowLeft' && !e.target.matches('input,textarea,select')) {
        goToPage(Math.max((window._currentPage || 1) - 1, 1));
    }
});

// ============================================================
// DATE FILTER
// ============================================================
function filterByTime(requests) {
    const timeFilter = document.getElementById('filter-time').value;
    if (timeFilter === 'all') return requests;
    
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    
    let startDate, endDate;
    if (timeFilter === 'this-month') {
        startDate = new Date(year, month, 1);
        endDate = new Date(year, month + 1, 0, 23, 59, 59);
    } else if (timeFilter === 'last-month') {
        startDate = new Date(year, month - 1, 1);
        endDate = new Date(year, month, 0, 23, 59, 59);
    } else if (timeFilter === '2-months') {
        startDate = new Date(year, month - 2, 1);
        endDate = new Date(year, month - 1, 0, 23, 59, 59);
    } else if (timeFilter === '3-months') {
        startDate = new Date(year, month - 3, 1);
        endDate = new Date(year, month - 2, 0, 23, 59, 59);
    }
    
    return requests.filter(r => {
        if (!r.created) return false;
        const d = new Date(r.created);
        return d >= startDate && d <= endDate;
    });
}

// ============================================================
// SORT
// ============================================================
function sortIds(ids, grouped) {
    const sortOrder = document.getElementById('sort-order').value;
    if (sortOrder === 'id-desc') return ids.sort((a,b) => Number(b) - Number(a));
    if (sortOrder === 'id-asc') return ids.sort((a,b) => Number(a) - Number(b));
    if (sortOrder === 'age-desc') {
        return ids.sort((a,b) => {
            const dateA = new Date(grouped[a][0].created || '2099-01-01');
            const dateB = new Date(grouped[b][0].created || '2099-01-01');
            return dateA - dateB; // oldest first
        });
    }
    return ids;
}

// ============================================================
// AGE CALCULATION
// ============================================================
function getAgeDays(dateStr) {
    if (!dateStr) return 0;
    const created = new Date(dateStr);
    const now = new Date();
    return Math.floor((now - created) / (1000*60*60*24));
}

function getAgeBadge(days) {
    if (days <= 7) return `<span class="age-badge age-ok">${days}d</span>`;
    if (days <= 30) return `<span class="age-badge age-warn">${days}d</span>`;
    return `<span class="age-badge age-danger">${days}d</span>`;
}

// ============================================================
// PROGRESS CALCULATION
// ============================================================
function getProgressPercent(id, reqs) {
    if (!reqs || reqs.length === 0) return 0;
    // If source status is Complete, it's 100%
    const sourceStatus = String(reqs[0].status || '').toLowerCase();
    if (sourceStatus === 'complete' || sourceStatus === 'canceled') return 100;
    
    // Check COD/DA Edit combo
    const hasCOD = reqs.some(r => r.requestType === 'COD');
    const hasDAEdit = reqs.some(r => r.requestType === 'DA Edit');
    if (hasCOD && hasDAEdit) {
        const comboKey = id + '-cod-da-route';
        const comboSaved = trackingData[comboKey] || {};
        const routeChoice = comboSaved['route'] || 'Waiting for BD';
        let total = 2;
        let progress = 0;
        if (comboSaved['info-request'] === 'Done') progress++;
        else if (comboSaved['info-request'] === 'In Progress') progress += 0.5;
        if (routeChoice !== 'Waiting for BD') {
            progress++;
            const chosenType = routeChoice;
            const steps = SUB_STEPS[chosenType] || [];
            const key = id + '-' + chosenType;
            const saved = trackingData[key] || {};
            total += steps.length;
            steps.forEach(s => {
                const val = saved[s.id] || 'Not Started';
                if (val === 'Complete' || val === 'Done' || val === 'Approved') progress++;
                else if (val === 'In Progress' || val === 'Send for Signature' || val === 'Send for Approval') progress += 0.5;
            });
        }
        return total === 0 ? 0 : Math.round((progress / total) * 100);
    }
    
    let total = 0, progress = 0;
    reqs.forEach(r => {
        const steps = SUB_STEPS[r.requestType] || [];
        const key = id + '-' + r.requestType;
        const saved = trackingData[key] || {};
        steps.forEach(s => {
            total++;
            const val = saved[s.id] || 'Not Started';
            if (val === 'Complete' || val === 'Done' || val === 'Approved') progress++;
            else if (val === 'In Progress' || val === 'Send for Signature' || val === 'Send for Approval') progress += 0.5;
        });
    });
    if (total === 0) return 0;
    return Math.round((progress / total) * 100);
}
