.circle{position:fixed;border-radius:50%;border:1.5px solid;pointer-events:none;}
@keyframes driftAll{0%{transform:translateX(0) translateY(0);}25%{transform:translateX(40px) translateY(-20px);}50%{transform:translateX(-30px) translateY(30px);}75%{transform:translateX(20px) translateY(-40px);}100%{transform:translateX(0) translateY(0);}}

<div id="circles-container"></div>
<script>
// Generate 40 animated circles
(function(){
  const container = document.getElementById('circles-container');
  const count = 40;
  for(let i=0;i<count;i++){
    const circle = document.createElement('div');
    const size = 30 + Math.random()*200;
    const top = Math.random()*100;
    const left = Math.random()*100;
    const delay = Math.random()*-20;
    const colors = ['rgba(78,200,240,','rgba(0,113,197,','rgba(107,203,119,','rgba(240,160,48,'];
    const color = colors[Math.floor(Math.random()*colors.length)] + (0.04+Math.random()*0.06)+')';
    circle.style.cssText = `position:fixed;border-radius:50%;pointer-events:none;border:1.5px solid ${color};width:${size}px;height:${size}px;top:${top}%;left:${left}%;animation:driftAll 20s ease-in-out infinite;animation-delay:${delay}s;`;
    container.appendChild(circle);
  }
})();
</script>

<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
    // Data files served from GitHub raw (same repo)
    dataFile: 'data/requests.json',
    trackingFile: 'data/tracking.json',
    
    // GitHub API for saving tracking (shared between Jenn and Jair)
    github: {
        owner: 'jairgarciaintel',
        repo: 'ifs-request-tracker',
        branch: 'main',
        trackingPath: 'data/tracking.json'
    },
    
    // SharePoint source (for reference)
    spSite: 'https://intel.sharepoint.com/sites/ifs-igo-requests',
    spList: 'New DA Request',
    dateFilter: '2026-07-01T00:00:00Z',
    
    // Auto-refresh every 10 minutes
    refreshInterval: 600000
};

// ============================================================
// SUB-STEPS BY REQUEST TYPE
// ============================================================
const SUB_STEPS = {
    'Portal Creation': [

// STATE

let allRequests = [];
let trackingData = {};
let refreshTimer = null;
let activeStatFilters = new Set(['all']); // multi-select stat filter

// ============================================================
// DATA: Fetch directly from SharePoint REST API (browser session)
// Your browser already has the auth cookie from being logged into SharePoint.
// We just call the API — no login popup, no tokens, no MSAL needed.
// ============================================================
async function fetchAndRender() {
    updateSync('Loading data...');
    try {
        // Load requests JSON (served by GitHub Pages from same directory)
        const reqRes = await fetch(CONFIG.dataFile + '?v=' + Date.now());
        if (!reqRes.ok) throw new Error('Cannot load ' + CONFIG.dataFile + ' (HTTP ' + reqRes.status + ')');
        const rawRequests = await reqRes.json();
        
        // SPLIT multi-service requests: "Code Name Request;#Portal creation;#New DA"
        // becomes 3 separate entries with the same ID
        allRequests = [];
        rawRequests.forEach(r => {
            const types = (r.requestType || 'Unknown').split(';#');
            types.forEach(t => {
                const normalizedType = normalizeType(t.trim());
                if (normalizedType) {
                    allRequests.push({ ...r, requestType: normalizedType });
                }
            });
        });

        await loadTracking();
        
        const now = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
        updateSync(rawRequests.length + ' requests (' + allRequests.length + ' services) \u00b7 ' + now);
        ensureUsername();
        renderRequests();
        startAutoRefresh();
        startRealtimePolling();
    } catch(err) {
        console.error('Fetch failed:', err);
        updateSync('Load failed \u2014 showing demo data');
        loadDemoData();
    }
}

// Normalize request type names to standard categories
function normalizeType(type) {
    const t = type.toLowerCase();
    if (t.includes('portal creation') || t === 'portal creation') return 'Portal Creation';
    if (t.includes('new da') || t === 'new da') return 'New DA';
    if (t.includes('code name') || t.includes('codename')) return 'Codename';
    if (t.includes('webview') || t.includes('ags role')) return 'WebView AGS Role';
    if (t.includes('portal unencryption') || t.includes('unecrypted')) return 'Portal Unencryption';
    if (t.includes('secure chamber')) return 'Secure Chamber';
    if (t.includes('ifs nda')) return 'IFS NDA';
    if (t.includes('mp-nda')) return 'MP-NDA';
    if (t.includes('da edit')) return 'DA Edit';
    if (t.includes('cod') && !t.includes('code')) return 'COD';
    if (t.includes('docusign')) return 'DocuSign Request';
    if (t.includes('redbook')) return 'Redbook Release';
    if (t.includes('collateral')) return 'Collateral List Change';
    if (t.includes('add product') || t.includes('new product')) return 'Add Product';
    if (t.includes('portal addition')) return 'Portal Addition';
    if (t.includes('mrunda')) return 'MRUNDA';
    if (t.includes('mpa-ic')) return 'MPA-IC';
    if (t.includes('ext. spo')) return 'Ext. SPO';
    if (t.includes('new folder')) return 'New Folder in SFT';
    // If it doesn't match known types, keep as-is
    return type.trim();
}

// ============================================================
// TRACKING: Firebase Realtime Database — instant sync + notifications
// ============================================================
const FIREBASE_DB = 'https://fs-request-tracker-default-rtdb.firebaseio.com';
let currentUser = localStorage.getItem('fs-username') || '';

function ensureUsername() {
    if (!currentUser) {
        currentUser = prompt('Your name (one time only - e.g., Jair or Jenn):') || 'Anonymous';
        localStorage.setItem('fs-username', currentUser);
    }
    return currentUser;
}

async function loadTracking() {
    try {
        const res = await fetch(`${FIREBASE_DB}/tracking.json`);
        if (res.ok) {
            const data = await res.json();
            if (data) trackingData = data;
        }
    } catch(e) {
        const saved = localStorage.getItem('ifs-tracker-data');
        if (saved) trackingData = JSON.parse(saved);
    }
}

async function saveTracking() {
    trackingData._lastSaved = new Date().toISOString();
    trackingData._lastUser = currentUser;
    localStorage.setItem('ifs-tracker-data', JSON.stringify(trackingData));
    
    try {
        await fetch(`${FIREBASE_DB}/tracking.json`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(trackingData)
        });
    } catch(e) {
        console.warn('Firebase save failed:', e);
    }
}

// (notifications handled by logHistory below)

// Set presence (who is working on a section)
async function setPresence(requestId, reqType) {
    const user = ensureUsername();
    try {
        await fetch(`${FIREBASE_DB}/presence/${requestId}---${reqType.replace(/\s/g,'_')}.json`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ user: user, since: new Date().toISOString() })
        });
    } catch(e) {}
}

// Log change to history
async function logHistory(requestId, customer, reqType, stepLabel, newValue) {
    const user = ensureUsername();
    const entry = {
        user: user,
        requestId: requestId,
        customer: customer,
        requestType: reqType,
        step: stepLabel,
        value: newValue,
        timestamp: new Date().toISOString()
    };
    try {
        await fetch(`${FIREBASE_DB}/history.json`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(entry)
        });
        // Also store as latest notification
        await fetch(`${FIREBASE_DB}/lastChange.json`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(entry)
        });
    } catch(e) {}
}

// Poll for changes every 5 seconds
let lastChangeTimestamp = '';
let presenceData = {};

function startRealtimePolling() {
    setInterval(async () => {
        // 1. Check last change notification
        try {
            const res = await fetch(`${FIREBASE_DB}/lastChange.json`);
            if (res.ok) {
                const data = await res.json();
                if (data && data.timestamp !== lastChangeTimestamp && data.user !== currentUser) {
                    lastChangeTimestamp = data.timestamp;
                    showNotification(data);
                } else if (data) {
                    lastChangeTimestamp = data.timestamp;
                }
            }
        } catch(e) {}
        
        // 2. Load viewing data (who has which request open)
        try {
            const res = await fetch(`${FIREBASE_DB}/viewing.json`);
            if (res.ok) {
                const viewingData = await res.json() || {};
                // Highlight cards that someone else has open
                document.querySelectorAll('.group-card').forEach(card => {
                    card.classList.remove('being-viewed');
                    const badge = card.querySelector('.viewing-badge');
                    if (badge) badge.remove();
                });
                const now = new Date().getTime();
                Object.entries(viewingData).forEach(([id, val]) => {
                    if (!val || val.user === currentUser) return;
                    // Only show if less than 2 minutes old
                    if (now - new Date(val.since).getTime() > 120000) return;
                    const card = document.getElementById('group-' + id);
                    if (card) {
                        card.classList.add('being-viewed');
                        const header = card.querySelector('.group-customer');
                        if (header && !card.querySelector('.viewing-badge')) {
                            const badge = document.createElement('span');
                            badge.className = 'viewing-badge';
                            badge.textContent = val.user;
                            header.after(badge);
                        }
                    }
                });
            }
        } catch(e) {}
        
        // 3. Reload tracking silently — do NOT re-render (causes cards to close)
        // Only re-render if there's a new change from another user
        const oldLastSaved = trackingData._lastSaved || '';
        await loadTracking();
        if (trackingData._lastSaved !== oldLastSaved && trackingData._lastUser !== currentUser) {
            // Save which cards are open
            const openCards = [];
            document.querySelectorAll('.group-card.open').forEach(c => openCards.push(c.id));
            renderRequests();
            // Restore open state
            openCards.forEach(id => { const el = document.getElementById(id); if(el) el.classList.add('open'); });
        }
    }, 5000);
}

function updatePresenceUI() {
    // Add presence indicators to type sections
    document.querySelectorAll('.type-section').forEach(section => {
        const existingBadge = section.querySelector('.presence-badge');
        if (existingBadge) existingBadge.remove();
    });
    
    const now = new Date().getTime();
    Object.entries(presenceData).forEach(([key, val]) => {
        if (!val || val.user === currentUser) return;
        // Only show if presence is less than 2 minutes old
        const since = new Date(val.since).getTime();
        if (now - since > 120000) return;
        
        // Find the matching section in the DOM
        const parts = key.split('---');
        const id = parts[0];
        const reqType = (parts[1] || '').replace(/_/g, ' ');
        const card = document.getElementById('group-' + id);
        if (!card) return;
        
        const sections = card.querySelectorAll('.type-section-title');
        sections.forEach(titleEl => {
            if (titleEl.textContent === reqType) {
                const badge = document.createElement('span');
                badge.className = 'presence-badge';
                badge.textContent = '\u2014 ' + val.user;
                titleEl.parentElement.insertBefore(badge, titleEl.nextSibling);
            }
        });
    });
}

function showNotification(n) {
    const banner = document.createElement('div');
    banner.className = 'notification-banner';
    banner.innerHTML = `
        <span class="notif-text"><strong>${n.user}</strong> changed #${n.requestId} ${n.requestType} \u2192 ${n.step}: <strong>${n.value}</strong></span>
        <button class="notif-close" onclick="this.parentElement.remove()">\u2715</button>
    `;
    document.body.prepend(banner);
    // Auto-dismiss after 8 seconds
    setTimeout(() => { if(banner.parentElement) banner.remove(); }, 8000);
}

function buildExcelData() {
    const rows = [];
    const grouped = groupByID(allRequests);
    Object.keys(grouped).forEach(id => {
        const group = grouped[id];
        const customer = group[0].customer;
        group.forEach(req => {
            const key = id + '-' + req.requestType;
            const steps = SUB_STEPS[req.requestType] || [];
            const saved = trackingData[key] || {};
            steps.forEach(step => {
                rows.push({
                    'ID': Number(id),
                    'Customer': customer,
                    'Request Type': req.requestType,
                    'Sub-Step': step.label,
                    'Status': saved[step.id] || 'Not Started',
                    'Updated': saved._updated || ''
                });
            });
        });
    });
    return rows;
}

// ============================================================
// STAT FILTER: Click pills to filter, multi-select supported
// ============================================================
function toggleStatFilter(status) {
    if (status === 'all') {
        // Click "total" = show all, clear other selections
        activeStatFilters = new Set(['all']);
    } else {
        // Remove 'all' if selecting specific filters
        activeStatFilters.delete('all');
        
        if (activeStatFilters.has(status)) {
            activeStatFilters.delete(status);
        } else {
            activeStatFilters.add(status);
        }
        
        // If nothing selected, go back to all
        if (activeStatFilters.size === 0) activeStatFilters = new Set(['all']);
    }
    
    // Update visual active state
    document.getElementById('stat-total').classList.toggle('stat-active', activeStatFilters.has('all'));
    document.getElementById('stat-progress').classList.toggle('stat-active', activeStatFilters.has('in-progress'));
    document.getElementById('stat-complete').classList.toggle('stat-active', activeStatFilters.has('complete'));
    document.getElementById('stat-new').classList.toggle('stat-active', activeStatFilters.has('not-started'));
    
    // Also sync the dropdown filter
    document.getElementById('filter-status').value = 'all';
    
    renderRequests();
}

// ============================================================
// RENDERING: Group by ID — one card per request ID
// ============================================================
function groupByID(requests) {
    const map = {};
    requests.forEach(r => {
        if (!r.id) return; // skip items without valid ID
        const id = String(r.id);
        if (!map[id]) map[id] = [];
        map[id].push(r);
    });
    return map;
}

function renderRequests() {
    const container = document.getElementById('request-list');
    const typeFilter = document.getElementById('filter-type').value;
    const search = document.getElementById('search-box').value.toLowerCase();

    // Filter only 2026 requests
    let filtered = allRequests.filter(r => {
        if (!r.created) return false;
        const year = new Date(r.created).getFullYear();
        return year === 2026;
    });

    // Time filter
    filtered = filterByTime(filtered);

    if (typeFilter !== 'all') filtered = filtered.filter(r => r.requestType === typeFilter);
    if (search) filtered = filtered.filter(r =>
        (r.customer||'').toLowerCase().includes(search) ||
        String(r.id).includes(search)
    );

    const grouped = groupByID(filtered);

    // Stats
    const allGrouped = groupByID(filtered);
    let totalGroups = Object.keys(allGrouped).length;
    let wipCount = 0, doneCount = 0, newCount = 0;
    Object.entries(allGrouped).forEach(([id, reqs]) => {
        const s = getGroupOverall(id, reqs);
        if (s==='complete') doneCount++;
        else if (s==='in-progress') wipCount++;
        else newCount++;
    });
    document.getElementById('stat-total').textContent = totalGroups + ' total';
    document.getElementById('stat-progress').textContent = wipCount + ' WIP';
    document.getElementById('stat-complete').textContent = doneCount + ' done';
    document.getElementById('stat-new').textContent = newCount + ' new';

    // Filter by overall status (from pills or dropdown)
    let ids = Object.keys(grouped);
    const statusFilter = document.getElementById('filter-status').value;
    
    if (!activeStatFilters.has('all')) {
        ids = ids.filter(id => activeStatFilters.has(getGroupOverall(id, grouped[id])));
    } else if (statusFilter !== 'all') {
        ids = ids.filter(id => getGroupOverall(id, grouped[id]) === statusFilter);
    }

    // Sort
    ids = sortIds(ids, grouped);

    if (ids.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No requests match filters</h3></div>';
        return;
    }

    // Pagination (50 per page)
    const PAGE_SIZE = 50;
    const totalPages = Math.ceil(ids.length / PAGE_SIZE);
    const currentPage = window._currentPage || 1;
    const startIdx = (currentPage - 1) * PAGE_SIZE;
    const pageIds = ids.slice(startIdx, startIdx + PAGE_SIZE);

    let html = pageIds.map(id => renderGroupCard(id, grouped[id])).join('');
    
    // Pagination controls
    if (totalPages > 1) {
        html += `<div class="pagination">
          <button onclick="goToPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>Prev</button>
          <span>Page ${currentPage} of ${totalPages} (${ids.length} requests)</span>
          <button onclick="goToPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>Next</button>
        </div>`;
    }
    
    container.innerHTML = html;
}

function renderGroupCard(id, reqs) {
    if (!reqs || reqs.length === 0) return '';
    const customer = reqs[0].customer || '\u2014';
    const date = reqs[0].created ? new Date(reqs[0].created).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '';
    const overall = getGroupOverall(id, reqs);
    const sourceStatus = reqs[0].status || '';
    const knownReqs = reqs.filter(r => r.requestType !== 'Unknown');
    const badges = knownReqs.map(r => `<span class="badge badge-${getBadgeClass(r.requestType)}">${r.requestType}</span>`).join('');
    const statusBadge = sourceStatus ? `<span class="badge badge-nda" style="font-style:italic;">${sourceStatus}</span>` : '';

    // Age badge
    const ageDays = getAgeDays(reqs[0].created);
    const ageBadge = (overall !== 'complete') ? getAgeBadge(ageDays) : '';

    // Progress bar
    const progress = getProgressPercent(id, reqs);
    const pfClass = overall === 'complete' ? 'pf-done' : overall === 'failed' ? 'pf-fail' : progress > 0 ? 'pf-wip' : 'pf-new';

    // Notes
    const noteData = (trackingData._notes && trackingData._notes[id]) || {};
    const noteText = noteData.text || '';
    const noteBy = noteData.by ? ` (${noteData.by})` : '';

    const sections = knownReqs.map(r => renderTypeSection(id, r)).join('');

    return `<div class="group-card" id="group-${id}">
      <div class="group-header" onclick="toggleGroup('${id}')">
        <span class="group-id">#${id}</span>
        <span class="group-customer">${customer}</span>
        <div class="group-badges">${badges}${statusBadge}</div>
        ${ageBadge}
        <span class="group-overall" title="SharePoint status: ${sourceStatus || 'No status'}">${svgIcon(overall)}</span>
        <span class="group-date">${date}</span>
        <span class="chevron">\u203A</span>
      </div>
      <div class="progress-track"><div class="progress-fill ${pfClass}" style="width:${progress}%"></div><span class="progress-pct">${progress}%</span></div>
      <div class="group-body">
        ${sections}
        <div class="notes-section">
          <textarea class="notes-input" placeholder="Notes (IT ticket, comments...)${noteBy}" onblur="saveNote('${id}',this)">${noteText}</textarea>
        </div>
        <div class="history-toggle" onclick="loadRequestHistory('${id}',this)">
          <svg width="12" height="12"><use href="#icon-progress"/></svg> View Change History
        </div>
        <div class="history-section" id="history-${id}" style="display:none;"></div>
      </div>
    </div>`;
}

function renderTypeSection(id, req) {
    const key = id + '-' + req.requestType;
    const steps = SUB_STEPS[req.requestType] || [];
    const saved = trackingData[key] || {};
    
    // If the source status from SharePoint is Complete, auto-complete all sub-steps
    const sourceComplete = (req.status || '').toLowerCase() === 'complete' || (req.status || '').toLowerCase() === 'canceled';
    
    const sectionOverall = sourceComplete ? 'complete' : getSectionOverall(key, steps);
    const titleClass = 'title-' + getBadgeClass(req.requestType);

    const rows = steps.map(step => {
        // If source is complete, force all steps to show as Complete
        let val;
        if (sourceComplete) {
            val = (step.id === 'ags-approved-role') ? 'Approved' : 'Complete';
        } else {
            val = saved[step.id] || 'Not Started';
        }
        const cls = selectClass(val);
        const disabled = sourceComplete ? 'disabled' : '';
        const opts = statusOptions(req.requestType, step.id).map(s =>
            `<option value="${s}"${s===val?' selected':''}>${s}</option>`
        ).join('');
        // Show who made this change
        const changedBy = saved[step.id + '_by'] || '';
        const byLabel = (changedBy && val !== 'Not Started') ? `<span class="changed-by">${changedBy}</span>` : '';
        return `<div class="substep-row">
          <span class="substep-label">${step.label}</span>
          <select class="substep-select ${cls}" ${disabled} onchange="updateStep('${key}','${step.id}',this.value,this)">${opts}</select>
          ${byLabel}
        </div>`;
    }).join('');

    return `<div class="type-section">
      <div class="type-section-header">
        <span class="type-section-title ${titleClass}">${req.requestType}</span>
        <span class="section-status">${svgIcon(sectionOverall)} <span>${statusLabel(sectionOverall)}</span></span>
      </div>
      ${rows}
    </div>`;
}

// INTERACTIONS
// ============================================================
function toggleGroup(id) {
    const card = document.getElementById('group-' + id);
    card.classList.toggle('open');
    // Notify presence: this user opened this request
    if (card.classList.contains('open')) {
        const user = ensureUsername();
        fetch(`${FIREBASE_DB}/viewing/${id}.json`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ user: user, since: new Date().toISOString() })
        }).catch(()=>{});
    } else {
        // User closed it — remove presence
        fetch(`${FIREBASE_DB}/viewing/${id}.json`, { method: 'DELETE' }).catch(()=>{});
    }
}

function updateStep(key, stepId, value, el) {
    if (!trackingData[key]) trackingData[key] = {};
    trackingData[key][stepId] = value;
    trackingData[key][stepId + '_by'] = currentUser;
    trackingData[key]._updated = new Date().toISOString();
    trackingData[key]._updatedBy = currentUser;
    el.className = 'substep-select ' + selectClass(value);
    saveTracking();
    
    // Send notification to other users
    const id = key.split('-')[0];
    const reqType = key.substring(id.length + 1);
    const steps = SUB_STEPS[reqType] || [];
    const stepObj = steps.find(s => s.id === stepId);
    const stepLabel = stepObj ? stepObj.label : stepId;
    const req = allRequests.find(r => String(r.id) === id && r.requestType === reqType);
    const customer = req ? req.customer : '';
    logHistory(id, customer, reqType, stepLabel, value);
    setPresence(id, reqType);
    
    // Refresh section status icon
    const section = el.closest('.type-section');
    const statusSpan = section.querySelector('.section-status');
    const s = getSectionOverall(key, steps);
    statusSpan.innerHTML = svgIcon(s) + ' <span>' + statusLabel(s) + '</span>';
    // Refresh group icon + progress bar
    const card = el.closest('.group-card');
    const reqs = allRequests.filter(r => String(r.id) === id);
    const g = getGroupOverall(id, reqs);
    card.querySelector('.group-overall').innerHTML = svgIcon(g);
    // Update progress bar
    const progress = getProgressPercent(id, reqs);
    const pBar = card.querySelector('.progress-fill');
    const pPct = card.querySelector('.progress-pct');
    if (pBar) { pBar.style.width = progress + '%'; pBar.className = 'progress-fill ' + (g==='complete'?'pf-done':g==='failed'?'pf-fail':progress>0?'pf-wip':'pf-new'); }
    if (pPct) pPct.textContent = progress + '%';
}

function getBadgeClass(type) {
    const map = {
        'Portal Creation':'portal','New DA':'nda','Codename':'codename',
        'WebView AGS Role':'webview','Portal Unencryption':'webview',
        'Secure Chamber':'portal','IFS NDA':'nda','MP-NDA':'nda',
        'DA Edit':'codename','COD':'codename','DocuSign Request':'nda',
        'Redbook Release':'webview'
    };
    return map[type]||'nda';
}

function selectClass(val) {
    const m = {'Complete':'st-complete','Done':'st-done','Approved':'st-approved','In Progress':'st-inprogress','Send for Approval':'st-send','Fail':'st-fail','Not Started':'st-notstarted'};
    return m[val]||'st-notstarted';
}

function statusOptions(reqType, stepId) {
    if (stepId === 'ags-approved-role') return ['Not Started','Send for Approval','Approved'];
    if (stepId === 'create-da' || stepId === 'create-portal') return ['Not Started','In Progress','Complete','Fail'];
    if (reqType === 'Portal Creation') return ['Not Started','In Progress','Complete','Fail'];
    if (reqType === 'New DA') {
        if (stepId === 'acknowledge') return ['Not Started','Complete'];
        return ['Not Started','In Progress','Complete'];
    }
    // Single-step services (Codename, WebView, etc.)
    return ['Not Started','In Progress','Complete','Done'];
}

function getSectionOverall(key, steps) {
    // If no sub-steps defined for this type, use the source status from Excel
    if (!steps || steps.length === 0) return 'not-started';
    const saved = trackingData[key] || {};
    const vals = steps.map(s => saved[s.id] || 'Not Started');
    if (vals.some(v => v==='Fail')) return 'failed';
    if (vals.every(v => v==='Complete'||v==='Done'||v==='Approved')) return 'complete';
    if (vals.some(v => v!=='Not Started')) return 'in-progress';
    return 'not-started';
}

function getGroupOverall(id, reqs) {
    // First check: if the SOURCE status from SharePoint says Complete/Canceled, use that
    const sourceStatus = (reqs[0].status || '').toLowerCase();
    if (sourceStatus === 'complete' || sourceStatus === 'canceled') return 'complete';
    if (sourceStatus === 'wip' || sourceStatus === 'in approval loop' || sourceStatus === 'out for signature' || sourceStatus === 'it request submitted') return 'in-progress';
    
    // Otherwise, calculate from tracking sub-steps
    const sectionStatuses = reqs.map(r => {
        const key = id + '-' + r.requestType;
        const steps = SUB_STEPS[r.requestType] || [];
        return getSectionOverall(key, steps);
    });
    if (sectionStatuses.some(s => s==='failed')) return 'failed';
    if (sectionStatuses.every(s => s==='complete')) return 'complete';
    if (sectionStatuses.some(s => s!=='not-started')) return 'in-progress';
    return 'not-started';
}

function statusLabel(s) {
    return {'complete':'Done','in-progress':'In Progress','failed':'Failed','not-started':'New'}[s]||'New';
}

function svgIcon(status) {
    const map = {
        'complete': '<svg width="16" height="16"><use href="#icon-check"/></svg>',
        'in-progress': '<svg width="16" height="16"><use href="#icon-progress"/></svg>',
        'failed': '<svg width="16" height="16"><use href="#icon-fail"/></svg>',
        'not-started': '<svg width="16" height="16"><use href="#icon-new"/></svg>'
    };
    return map[status] || map['not-started'];
}

// ============================================================
// HISTORY: Load and display change history for a request
// ============================================================
async function loadRequestHistory(id, toggleEl) {
    const historyDiv = document.getElementById('history-' + id);
    
    // Toggle visibility
    if (historyDiv.style.display !== 'none') {
        historyDiv.style.display = 'none';
        return;
    }
    historyDiv.style.display = 'block';
    historyDiv.innerHTML = '<div style="font-size:11px;color:rgba(255,255,255,0.3);">Loading...</div>';
    
    try {
        const res = await fetch(`${FIREBASE_DB}/history.json`);
        if (!res.ok) throw new Error('Failed');
        const allHistory = await res.json();
        
        if (!allHistory) {
            historyDiv.innerHTML = '<div style="font-size:11px;color:rgba(255,255,255,0.3);">No history yet</div>';
            return;
        }
        
        // Filter entries for this request ID
        const entries = Object.values(allHistory)
            .filter(h => String(h.requestId) === String(id))
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
            .slice(0, 20); // last 20 changes
        
        if (entries.length === 0) {
            historyDiv.innerHTML = '<div style="font-size:11px;color:rgba(255,255,255,0.3);">No changes recorded</div>';
            return;
        }
        
        historyDiv.innerHTML = entries.map(h => {
            const time = new Date(h.timestamp).toLocaleString('en-US', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
            return `<div class="history-entry">
                <span class="history-time">${time}</span>
                <span><strong>${h.user}</strong> set ${h.requestType} \u2192 ${h.step}: <strong>${h.value}</strong></span>
            </div>`;
        }).join('');
    } catch(e) {
        historyDiv.innerHTML = '<div style="font-size:11px;color:#ff6b6b;">Could not load history</div>';
    }
}

document.addEventListener('keydown', (e) => {
    // Ctrl+E = expand all, Ctrl+W = collapse all
    if (e.ctrlKey && e.key === 'e') { e.preventDefault(); toggleAllCards(true); }
    if (e.ctrlKey && e.key === 'w') { e.preventDefault(); toggleAllCards(false); }
    // Arrow left/right for pagination
    if (e.key === 'ArrowRight' && !e.target.matches('input,textarea,select')) {
        const totalPages = Math.ceil(document.querySelectorAll('.group-card').length > 0 ? 999 : 1);
        goToPage(Math.min((window._currentPage || 1) + 1, totalPages));
    }
    if (e.key === 'ArrowLeft' && !e.target.matches('input,textarea,select')) {
        goToPage(Math.max((window._currentPage || 1) - 1, 1));
    }
});

// ============================================================
// DATE FILTER
// ============================================================
function filterByTime(requests) {
    const timeFilter = document.getElementById('filter-time').value;
    if (timeFilter === 'all') return requests;
    
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    
    let startDate, endDate;
    if (timeFilter === 'this-month') {
        startDate = new Date(year, month, 1);
        endDate = new Date(year, month + 1, 0, 23, 59, 59);
    } else if (timeFilter === 'last-month') {
        startDate = new Date(year, month - 1, 1);
        endDate = new Date(year, month, 0, 23, 59, 59);
    } else if (timeFilter === '2-months') {
        startDate = new Date(year, month - 2, 1);
        endDate = new Date(year, month - 1, 0, 23, 59, 59);
    } else if (timeFilter === '3-months') {
        startDate = new Date(year, month - 3, 1);
        endDate = new Date(year, month - 2, 0, 23, 59, 59);
    }
    
    return requests.filter(r => {
        if (!r.created) return false;
        const d = new Date(r.created);
        return d >= startDate && d <= endDate;
    });
}

// ============================================================
// SORT
// ============================================================
function sortIds(ids, grouped) {
    const sortOrder = document.getElementById('sort-order').value;
    if (sortOrder === 'id-desc') return ids.sort((a,b) => Number(b) - Number(a));
    if (sortOrder === 'id-asc') return ids.sort((a,b) => Number(a) - Number(b));
    if (sortOrder === 'age-desc') {
        return ids.sort((a,b) => {
            const dateA = new Date(grouped[a][0].created || '2099-01-01');
            const dateB = new Date(grouped[b][0].created || '2099-01-01');
            return dateA - dateB; // oldest first
        });
    }
    return ids;
}

// ============================================================
// AGE CALCULATION
// ============================================================
function getAgeDays(dateStr) {
    if (!dateStr) return 0;
    const created = new Date(dateStr);
    const now = new Date();
    return Math.floor((now - created) / (1000*60*60*24));
}

function getAgeBadge(days) {
    if (days <= 7) return `<span class="age-badge age-ok">${days}d</span>`;
    if (days <= 30) return `<span class="age-badge age-warn">${days}d</span>`;
    return `<span class="age-badge age-danger">${days}d</span>`;
}

// ============================================================
// PROGRESS CALCULATION
// ============================================================
function getProgressPercent(id, reqs) {
    if (!reqs || reqs.length === 0) return 0;
    // If source status is Complete, it's 100%
    const sourceStatus = (reqs[0].status || '').toLowerCase();
    if (sourceStatus === 'complete' || sourceStatus === 'canceled') return 100;
    
    let total = 0, done = 0;
    reqs.forEach(r => {
        const steps = SUB_STEPS[r.requestType] || [];
        const key = id + '-' + r.requestType;
        const saved = trackingData[key] || {};
        steps.forEach(s => {
            total++;
            const val = saved[s.id] || 'Not Started';
            if (val === 'Complete' || val === 'Done' || val === 'Approved') done++;
        });
    });
    if (total === 0) return 0;
    return Math.round((done / total) * 100);
}
