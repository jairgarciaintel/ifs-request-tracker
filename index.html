<style>

<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
    // Data files served from GitHub raw (same repo)
    dataFile: 'data/requests.json',
    trackingFile: 'data/tracking.json',
    
    // GitHub API for saving tracking (shared between Jenn and Jair)
    github: {
        owner: 'jairgarciaintel',
        repo: 'ifs-request-tracker',
        branch: 'main',
        trackingPath: 'data/tracking.json'
    },
    
    // SharePoint source (for reference)
    spSite: 'https://intel.sharepoint.com/sites/ifs-igo-requests',
    spList: 'New DA Request',
    dateFilter: '2026-07-01T00:00:00Z',
    
    // Auto-refresh every 10 minutes
    refreshInterval: 600000
};

// ============================================================
// SUB-STEPS BY REQUEST TYPE
// ============================================================
const SUB_STEPS = {
    'Portal Creation': [
        {id:'create-da', label:'Create DA'},
        {id:'create-portal', label:'Create Portal'},
        {id:'configure-ags', label:'Configure AGS'},
        {id:'configure-jsm', label:'Configure JSM (Jira Service Management)'},
        {id:'configure-security-ft', label:'Configure Security File Transfer'},
        {id:'configure-access-mgmt', label:'Configure Access Management'},
        {id:'ags-approved-role', label:'AGS Approved Role'}
    ],
    'New DA': [
        {id:'acknowledge', label:'Acknowledge'},
        {id:'in-approval-loop', label:'In Approval Loop'},
        {id:'add-force-signature', label:'Add Force Signature'}
    ],
    'Codename': [
        {id:'codename-created', label:'Codename Created'}
    ],
    'WebView AGS Role': [
        {id:'webview-ags-done', label:'WebView AGS Role'}
    ],
    'Portal Unencryption': [
        {id:'portal-unencryption-done', label:'Portal Unencryption'}
    ],
    'Secure Chamber': [
        {id:'secure-chamber-done', label:'Secure Chamber Setup'}
    ],
    'IFS NDA': [
        {id:'ifs-nda-done', label:'IFS NDA Executed'}
    ],
    'MP-NDA': [
        {id:'mp-nda-done', label:'MP-NDA Executed'}
    ],
    'DA Edit': [
        {id:'da-edit-done', label:'DA Edit Completed'}
    ],
    'COD': [
        {id:'cod-done', label:'COD Completed'}
    ],
    'DocuSign Request': [
        {id:'docusign-done', label:'DocuSign Sent'}
    ],
    'Redbook Release': [
        {id:'redbook-done', label:'Redbook Released'}
    ]
};

// ============================================================
// STATE
// ============================================================
let allRequests = [];
let trackingData = {};
let refreshTimer = null;
let activeStatFilters = new Set(['all']); // multi-select stat filter

// ============================================================
// DATA: Fetch directly from SharePoint REST API (browser session)
// Your browser already has the auth cookie from being logged into SharePoint.
// We just call the API — no login popup, no tokens, no MSAL needed.
// ============================================================
async function fetchAndRender() {
    updateSync('Loading data...');
    try {
        // Load requests JSON (served by GitHub Pages from same directory)
        const reqRes = await fetch(CONFIG.dataFile + '?v=' + Date.now());
        if (!reqRes.ok) throw new Error('Cannot load ' + CONFIG.dataFile + ' (HTTP ' + reqRes.status + ')');
        const rawRequests = await reqRes.json();
        
        // SPLIT multi-service requests: "Code Name Request;#Portal creation;#New DA"
        // becomes 3 separate entries with the same ID
        allRequests = [];
        rawRequests.forEach(r => {
            const types = (r.requestType || 'Unknown').split(';#');
            types.forEach(t => {
                const normalizedType = normalizeType(t.trim());
                if (normalizedType) {
                    allRequests.push({ ...r, requestType: normalizedType });
                }
            });
        });

        await loadTracking();
        
        const now = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
        updateSync(rawRequests.length + ' requests (' + allRequests.length + ' services) \u00b7 ' + now);
        ensureUsername();
        renderRequests();
        startAutoRefresh();
        startRealtimePolling();
    } catch(err) {
        console.error('Fetch failed:', err);
        updateSync('Load failed \u2014 showing demo data');
        loadDemoData();
    }
}

// Normalize request type names to standard categories
function normalizeType(type) {
    const t = type.toLowerCase();
    if (t.includes('portal creation') || t === 'portal creation') return 'Portal Creation';
    if (t.includes('new da') || t === 'new da') return 'New DA';
    if (t.includes('code name') || t.includes('codename')) return 'Codename';
    if (t.includes('webview') || t.includes('ags role')) return 'WebView AGS Role';
    if (t.includes('portal unencryption') || t.includes('unecrypted')) return 'Portal Unencryption';
    if (t.includes('secure chamber')) return 'Secure Chamber';
    if (t.includes('ifs nda')) return 'IFS NDA';
    if (t.includes('mp-nda')) return 'MP-NDA';
    if (t.includes('da edit')) return 'DA Edit';
    if (t.includes('cod') && !t.includes('code')) return 'COD';
    if (t.includes('docusign')) return 'DocuSign Request';
    if (t.includes('redbook')) return 'Redbook Release';
    if (t.includes('collateral')) return 'Collateral List Change';
    if (t.includes('add product') || t.includes('new product')) return 'Add Product';
    if (t.includes('portal addition')) return 'Portal Addition';
    if (t.includes('mrunda')) return 'MRUNDA';
    if (t.includes('mpa-ic')) return 'MPA-IC';
    if (t.includes('ext. spo')) return 'Ext. SPO';
    if (t.includes('new folder')) return 'New Folder in SFT';
    // If it doesn't match known types, keep as-is
    return type.trim();
}

// ============================================================
// TRACKING: Firebase Realtime Database — instant sync + notifications
// ============================================================
const FIREBASE_DB = 'https://fs-request-tracker-default-rtdb.firebaseio.com';
let currentUser = localStorage.getItem('ifs-username') || '';

function ensureUsername() {
    if (!currentUser) {
        currentUser = prompt('Enter your name (e.g., Jair or Jenn):') || 'Anonymous';
        localStorage.setItem('ifs-username', currentUser);
    }
    return currentUser;
}

async function loadTracking() {
    try {
        const res = await fetch(`${FIREBASE_DB}/tracking.json`);
        if (res.ok) {
            const data = await res.json();
            if (data) trackingData = data;
        }
    } catch(e) {
        const saved = localStorage.getItem('ifs-tracker-data');
        if (saved) trackingData = JSON.parse(saved);
    }
}

async function saveTracking() {
    trackingData._lastSaved = new Date().toISOString();
    trackingData._lastUser = currentUser;
    localStorage.setItem('ifs-tracker-data', JSON.stringify(trackingData));
    
    try {
        await fetch(`${FIREBASE_DB}/tracking.json`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(trackingData)
        });
    } catch(e) {
        console.warn('Firebase save failed:', e);
    }
}

// Send a notification when a step changes
async function sendNotification(requestId, customer, reqType, stepLabel, newValue) {
    const user = ensureUsername();
    const notification = {
        user: user,
        requestId: requestId,
        customer: customer,
        requestType: reqType,
        step: stepLabel,
        value: newValue,
        timestamp: new Date().toISOString()
    };
    try {
        await fetch(`${FIREBASE_DB}/notifications.json`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(notification)
        });
    } catch(e) {}
}

// Set presence (who is working)
async function setPresence(requestId, reqType) {
    const user = ensureUsername();
    try {
        await fetch(`${FIREBASE_DB}/presence/${requestId}-${reqType}.json`, {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ user: user, since: new Date().toISOString() })
        });
    } catch(e) {}
}

// Poll for notifications and presence every 5 seconds
let lastNotifCheck = new Date().toISOString();
function startRealtimePolling() {
    setInterval(async () => {
        // Check for new notifications
        try {
            const res = await fetch(`${FIREBASE_DB}/notifications.json?orderBy="timestamp"&startAt="${lastNotifCheck}"`);
            if (res.ok) {
                const data = await res.json();
                if (data) {
                    Object.values(data).forEach(n => {
                        if (n.user !== currentUser && n.timestamp > lastNotifCheck) {
                            showNotification(n);
                        }
                    });
                }
            }
            lastNotifCheck = new Date().toISOString();
        } catch(e) {}
        
        // Reload tracking to see other user's changes
        await loadTracking();
        renderRequests();
    }, 5000);
}

function showNotification(n) {
    const banner = document.createElement('div');
    banner.className = 'notification-banner';
    banner.innerHTML = `
        <span class="notif-text"><strong>${n.user}</strong> changed #${n.requestId} ${n.requestType} \u2192 ${n.step}: <strong>${n.value}</strong></span>
        <button class="notif-close" onclick="this.parentElement.remove()">\u2715</button>
    `;
    document.body.prepend(banner);
}

function buildExcelData() {
    const rows = [];
    const grouped = groupByID(allRequests);
    Object.keys(grouped).forEach(id => {
        const group = grouped[id];
        const customer = group[0].customer;
        group.forEach(req => {
            const key = id + '-' + req.requestType;
            const steps = SUB_STEPS[req.requestType] || [];
            const saved = trackingData[key] || {};
            steps.forEach(step => {
                rows.push({
                    'ID': Number(id),
                    'Customer': customer,
                    'Request Type': req.requestType,
                    'Sub-Step': step.label,
                    'Status': saved[step.id] || 'Not Started',
                    'Updated': saved._updated || ''
                });
            });
        });
    });
    return rows;
}

// ============================================================
// STAT FILTER: Click pills to filter, multi-select supported
// ============================================================
function toggleStatFilter(status) {
    if (status === 'all') {
        // Click "total" = show all, clear other selections
        activeStatFilters = new Set(['all']);
    } else {
        // Remove 'all' if selecting specific filters
        activeStatFilters.delete('all');
        
        if (activeStatFilters.has(status)) {
            activeStatFilters.delete(status);
        } else {
            activeStatFilters.add(status);
        }
        
        // If nothing selected, go back to all
        if (activeStatFilters.size === 0) activeStatFilters = new Set(['all']);
    }
    
    // Update visual active state
    document.getElementById('stat-total').classList.toggle('stat-active', activeStatFilters.has('all'));
    document.getElementById('stat-progress').classList.toggle('stat-active', activeStatFilters.has('in-progress'));
    document.getElementById('stat-complete').classList.toggle('stat-active', activeStatFilters.has('complete'));
    document.getElementById('stat-new').classList.toggle('stat-active', activeStatFilters.has('not-started'));
    
    // Also sync the dropdown filter
    document.getElementById('filter-status').value = 'all';
    
    renderRequests();
}

// ============================================================
// RENDERING: Group by ID — one card per request ID
// ============================================================
function groupByID(requests) {
    const map = {};
    requests.forEach(r => {
        if (!map[r.id]) map[r.id] = [];
        map[r.id].push(r);
    });
    return map;
}

function renderRequests() {
    const container = document.getElementById('request-list');
    const typeFilter = document.getElementById('filter-type').value;
    const search = document.getElementById('search-box').value.toLowerCase();

    // Filter only 2026 requests
    let filtered = allRequests.filter(r => {
        if (!r.created) return false;
        const year = new Date(r.created).getFullYear();
        return year === 2026;
    });

    if (typeFilter !== 'all') filtered = filtered.filter(r => r.requestType === typeFilter);
    if (search) filtered = filtered.filter(r =>
        (r.customer||'').toLowerCase().includes(search) ||
        String(r.id).includes(search)
    );

    const grouped = groupByID(filtered);

    // Stats (based on 2026 data)
    const allGrouped = groupByID(filtered);
    let totalGroups = Object.keys(allGrouped).length;
    let wipCount = 0, doneCount = 0, newCount = 0;
    Object.entries(allGrouped).forEach(([id, reqs]) => {
        const s = getGroupOverall(id, reqs);
        if (s==='complete') doneCount++;
        else if (s==='in-progress') wipCount++;
        else newCount++;
    });
    document.getElementById('stat-total').textContent = totalGroups + ' requests';
    document.getElementById('stat-progress').textContent = wipCount + ' WIP';
    document.getElementById('stat-complete').textContent = doneCount + ' done';
    document.getElementById('stat-new').textContent = newCount + ' new';

    // Filter by overall status (from pills or dropdown)
    let ids = Object.keys(grouped);
    const statusFilter = document.getElementById('filter-status').value;
    
    if (!activeStatFilters.has('all')) {
        // Use pill multi-select
        ids = ids.filter(id => activeStatFilters.has(getGroupOverall(id, grouped[id])));
    } else if (statusFilter !== 'all') {
        // Use dropdown single-select
        ids = ids.filter(id => getGroupOverall(id, grouped[id]) === statusFilter);
    }

    // Sort IDs descending (highest/newest first)
    ids.sort((a, b) => Number(b) - Number(a));

    if (ids.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No requests match filters</h3></div>';
        return;
    }

    container.innerHTML = ids.map(id => renderGroupCard(id, grouped[id])).join('');
}

function renderGroupCard(id, reqs) {
    const customer = reqs[0].customer || '\u2014';
    const date = reqs[0].created ? new Date(reqs[0].created).toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'}) : '';
    const overall = getGroupOverall(id, reqs);
    const sourceStatus = reqs[0].status || '';
    // Only show badges for known types (not Unknown)
    const knownReqs = reqs.filter(r => r.requestType !== 'Unknown');
    const badges = knownReqs.map(r => `<span class="badge badge-${getBadgeClass(r.requestType)}">${r.requestType}</span>`).join('');
    // Show source status from SharePoint if it exists
    const statusBadge = sourceStatus ? `<span class="badge badge-nda" style="font-style:italic;">${sourceStatus}</span>` : '';

    const sections = knownReqs.map(r => renderTypeSection(id, r)).join('');

    return `<div class="group-card" id="group-${id}">
      <div class="group-header" onclick="toggleGroup('${id}')">
        <span class="group-id">#${id}</span>
        <span class="group-customer">${customer}</span>
        <div class="group-badges">${badges}${statusBadge}</div>
        <span class="group-overall">${svgIcon(overall)}</span>
        <span class="group-date">${date}</span>
        <span class="chevron">\u203A</span>
      </div>
      <div class="group-body">${sections}</div>
    </div>`;
}

function renderTypeSection(id, req) {
    const key = id + '-' + req.requestType;
    const steps = SUB_STEPS[req.requestType] || [];
    const saved = trackingData[key] || {};
    
    // If the source status from SharePoint is Complete, auto-complete all sub-steps
    const sourceComplete = (req.status || '').toLowerCase() === 'complete' || (req.status || '').toLowerCase() === 'canceled';
    
    const sectionOverall = sourceComplete ? 'complete' : getSectionOverall(key, steps);
    const titleClass = 'title-' + getBadgeClass(req.requestType);

    const rows = steps.map(step => {
        // If source is complete, force all steps to show as Complete
        let val;
        if (sourceComplete) {
            val = (step.id === 'ags-approved-role') ? 'Approved' : 'Complete';
        } else {
            val = saved[step.id] || 'Not Started';
        }
        const cls = selectClass(val);
        const disabled = sourceComplete ? 'disabled' : '';
        const opts = statusOptions(req.requestType, step.id).map(s =>
            `<option value="${s}"${s===val?' selected':''}>${s}</option>`
        ).join('');
        return `<div class="substep-row">
          <span class="substep-label">${step.label}</span>
          <select class="substep-select ${cls}" ${disabled} onchange="updateStep('${key}','${step.id}',this.value,this)">${opts}</select>
        </div>`;
    }).join('');

    return `<div class="type-section">
      <div class="type-section-header">
        <span class="type-section-title ${titleClass}">${req.requestType}</span>
        <span class="section-status">${svgIcon(sectionOverall)} <span>${statusLabel(sectionOverall)}</span></span>
      </div>
      ${rows}
    </div>`;
}

// ============================================================
// INTERACTIONS
// ============================================================
function toggleGroup(id) {
    document.getElementById('group-' + id).classList.toggle('open');
}

function updateStep(key, stepId, value, el) {
    if (!trackingData[key]) trackingData[key] = {};
    trackingData[key][stepId] = value;
    trackingData[key]._updated = new Date().toISOString();
    trackingData[key]._updatedBy = currentUser;
    el.className = 'substep-select ' + selectClass(value);
    saveTracking();
    
    // Send notification to other users
    const id = key.split('-')[0];
    const reqType = key.substring(id.length + 1);
    const steps = SUB_STEPS[reqType] || [];
    const stepObj = steps.find(s => s.id === stepId);
    const stepLabel = stepObj ? stepObj.label : stepId;
    const req = allRequests.find(r => String(r.id) === id && r.requestType === reqType);
    const customer = req ? req.customer : '';
    sendNotification(id, customer, reqType, stepLabel, value);
    setPresence(id, reqType);
    
    // Refresh section status icon
    const section = el.closest('.type-section');
    const statusSpan = section.querySelector('.section-status');
    const s = getSectionOverall(key, steps);
    statusSpan.innerHTML = svgIcon(s) + ' <span>' + statusLabel(s) + '</span>';
    // Refresh group icon
    const card = el.closest('.group-card');
    const reqs = allRequests.filter(r => String(r.id) === id);
    const g = getGroupOverall(id, reqs);
    card.querySelector('.group-overall').innerHTML = svgIcon(g);
}

// ============================================================
// HELPERS
// ============================================================
function getBadgeClass(type) {
    const map = {
        'Portal Creation':'portal','New DA':'nda','Codename':'codename',
        'WebView AGS Role':'webview','Portal Unencryption':'webview',
        'Secure Chamber':'portal','IFS NDA':'nda','MP-NDA':'nda',
        'DA Edit':'codename','COD':'codename','DocuSign Request':'nda',
        'Redbook Release':'webview'
    };
    return map[type]||'nda';
}

function selectClass(val) {
    const m = {'Complete':'st-complete','Done':'st-done','Approved':'st-approved','In Progress':'st-inprogress','Send for Approval':'st-send','Fail':'st-fail','Not Started':'st-notstarted'};
    return m[val]||'st-notstarted';
}

function statusOptions(reqType, stepId) {
    if (stepId === 'ags-approved-role') return ['Not Started','Send for Approval','Approved'];
    if (stepId === 'create-da' || stepId === 'create-portal') return ['Not Started','In Progress','Complete','Fail'];
    if (reqType === 'Portal Creation') return ['Not Started','In Progress','Complete','Fail'];
    if (reqType === 'New DA') {
        if (stepId === 'acknowledge') return ['Not Started','Complete'];
        return ['Not Started','In Progress','Complete'];
    }
    // Single-step services (Codename, WebView, etc.)
    return ['Not Started','In Progress','Complete','Done'];
}

function getSectionOverall(key, steps) {
    // If no sub-steps defined for this type, use the source status from Excel
    if (!steps || steps.length === 0) return 'not-started';
    const saved = trackingData[key] || {};
    const vals = steps.map(s => saved[s.id] || 'Not Started');
    if (vals.some(v => v==='Fail')) return 'failed';
    if (vals.every(v => v==='Complete'||v==='Done'||v==='Approved')) return 'complete';
    if (vals.some(v => v!=='Not Started')) return 'in-progress';
    return 'not-started';
}

function getGroupOverall(id, reqs) {
    // First check: if the SOURCE status from SharePoint says Complete/Canceled, use that
    const sourceStatus = (reqs[0].status || '').toLowerCase();
    if (sourceStatus === 'complete' || sourceStatus === 'canceled') return 'complete';
    if (sourceStatus === 'wip' || sourceStatus === 'in approval loop' || sourceStatus === 'out for signature' || sourceStatus === 'it request submitted') return 'in-progress';
    
    // Otherwise, calculate from tracking sub-steps
    const sectionStatuses = reqs.map(r => {
        const key = id + '-' + r.requestType;
        const steps = SUB_STEPS[r.requestType] || [];
        return getSectionOverall(key, steps);
    });
    if (sectionStatuses.some(s => s==='failed')) return 'failed';
    if (sectionStatuses.every(s => s==='complete')) return 'complete';
    if (sectionStatuses.some(s => s!=='not-started')) return 'in-progress';
    return 'not-started';
}

function statusLabel(s) {
    return {'complete':'Done','in-progress':'In Progress','failed':'Failed','not-started':'New'}[s]||'New';
}

function svgIcon(status) {
    const map = {
        'complete': '<svg width="16" height="16"><use href="#icon-check"/></svg>',
        'in-progress': '<svg width="16" height="16"><use href="#icon-progress"/></svg>',
        'failed': '<svg width="16" height="16"><use href="#icon-fail"/></svg>',
        'not-started': '<svg width="16" height="16"><use href="#icon-new"/></svg>'
    };
    return map[status] || map['not-started'];
}
